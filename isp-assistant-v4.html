<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ISP Assistant · Security assessment workspace</title>
    <style>
      /* Presentation — all resources are embedded; no network access is used. */
      :root {
        --nav: #132b32;
        --nav-muted: #9eb4b8;
        --bg: #f4f6f6;
        --paper: #fff;
        --ink: #19343b;
        --muted: #65787d;
        --line: #dce5e5;
        --border: var(--line);
        --accent: var(--teal);
        --teal: #12786e;
        --light: #e8f4f0;
        --critical: #ae293e;
        --high: #b45e18;
        --medium: #946b08;
        --low: #226895;
        --info: #64737e;
        --shadow: 0 5px 20px #17353c06;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      a,
      input,
      select,
      textarea,
      summary {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #4ca89c;
      }
      button {
        color: inherit;
      }
      button.primary {
        background: var(--teal);
        color: white;
        border-color: var(--teal);
      }
      button.primary:hover {
        background: #0c625a;
      }
      button.danger {
        color: var(--critical);
      }
      button,
      .button {
        border: 1px solid var(--line);
        background: white;
        border-radius: 7px;
        padding: 9px 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        line-height: 1.25;
      }
      button:hover {
        background: #f1f6f5;
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
      }
      button.small {
        font-size: 12px;
        padding: 6px 9px;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.9px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      h3 {
        font-size: 15px;
      }
      p {
        line-height: 1.65;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.6px;
        font-size: 10px;
        font-weight: 750;
        color: var(--teal);
        margin-bottom: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--nav);
        color: white;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        letter-spacing: -0.4px;
        font-weight: 750;
        margin: 0 10px 34px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 38px;
        border-radius: 10px;
        background: #1c514f;
        color: #95dcc3;
      }
      .brand-mark svg {
        width: 24px;
        height: 24px;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 2px;
        display: block;
        font-weight: 500;
        color: var(--nav-muted);
        margin-top: 3px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.7px;
        color: var(--nav-muted);
        margin: 0 12px 10px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        background: transparent;
        border: 0;
        justify-content: flex-start;
        color: #b7c9cc;
        padding: 12px;
        border-radius: 7px;
        text-align: left;
        font-weight: 500;
      }
      .nav button.active {
        background: #24434a;
        color: white;
        box-shadow: inset 3px 0 #6dc3a7;
      }
      .nav button:hover {
        background: #203e45;
      }
      .nav button svg {
        margin-right: 4px;
      }
      .nav .count {
        margin-left: auto;
        font-size: 11px;
        background: #ffffff15;
        color: #dcece8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 32px 10px 0;
        color: #b7c9cc;
        font-size: 12px;
      }
      .local-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: #75c2a4;
      }
      .sidebar-bottom p {
        font-size: 11px;
        color: #90a9ae;
        margin: 0;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        min-height: 82px;
        background: #ffffffed;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 34px;
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(12px);
      }
      .project-caption {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .project-title {
        font-size: 14px;
        font-weight: 700;
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-progress {
        width: 130px;
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .progress-track {
        height: 4px;
        background: #e6eeed;
        border-radius: 4px;
        margin-top: 7px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        background: var(--teal);
        height: 100%;
        transition: width 0.2s;
      }
      .top-tools {
        display: flex;
        gap: 7px;
      }
      .top-tools button {
        font-size: 12px;
      }
      .export-wrap {
        position: relative;
      }
      .export-menu {
        position: absolute;
        right: 0;
        top: 44px;
        min-width: 205px;
        background: white;
        padding: 6px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px #14363c20;
        border-radius: 8px;
      }
      .export-menu button {
        display: flex;
        width: 100%;
        justify-content: flex-start;
        border: 0;
        padding: 11px;
      }
      .content {
        max-width: 1460px;
        margin: auto;
        padding: 34px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 27px;
      }
      .page-heading p {
        margin-bottom: 0;
        color: var(--muted);
        max-width: 700px;
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        box-shadow: var(--shadow);
      }
      .panel-head {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head h2 {
        margin-bottom: 5px;
      }
      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .panel-body {
        padding: 24px;
      }
      .qualification-layout {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .section-nav {
        padding: 10px;
        position: sticky;
        top: 108px;
      }
      .section-nav button {
        width: 100%;
        border: 0;
        text-align: left;
        justify-content: flex-start;
        font-size: 12px;
        font-weight: 500;
        padding: 11px 10px;
        background: transparent;
        gap: 10px;
        margin: 1px 0;
      }
      .section-nav button.active {
        background: var(--light);
        color: #086a60;
        font-weight: 700;
      }
      .section-nav .section-number {
        font-size: 10px;
        min-width: 20px;
        color: var(--muted);
      }
      .section-nav .check {
        margin-left: auto;
        color: var(--teal);
        font-size: 12px;
      }
      .section-description {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 25px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .field {
        display: block;
        min-width: 0;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field-label {
        font-size: 12px;
        font-weight: 650;
        display: block;
        margin-bottom: 9px;
      }
      .field-help {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: block;
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        width: 100%;
        border: 1px solid #cddbdc;
        border-radius: 6px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        min-width: 0;
      }
      input::placeholder,
      textarea::placeholder {
        color: #93a0a3;
      }
      textarea {
        resize: vertical;
        min-height: 86px;
        line-height: 1.6;
      }
      input[type="checkbox"] {
        accent-color: var(--teal);
        width: 16px;
        height: 16px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 6px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }
      .chip:has(input:checked) {
        border-color: #5ca89a;
        background: var(--light);
        color: #09675d;
      }
      .chip input {
        margin: 0;
      }
      .segmented {
        display: flex;
        gap: 0;
        width: max-content;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented label {
        position: relative;
        cursor: pointer;
        font-size: 11px;
        display: block;
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .segmented span {
        display: block;
        padding: 9px 12px;
        border-right: 1px solid var(--line);
        background: white;
      }
      .segmented label:last-child span {
        border: 0;
      }
      .segmented input:checked + span {
        background: var(--light);
        color: #09675d;
        font-weight: 700;
      }
      .segmented input:focus-visible + span {
        outline: 3px solid var(--teal);
        outline-offset: -3px;
      }
      .form-divider {
        grid-column: 1/-1;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        margin-top: 8px;
        font-weight: 650;
        font-size: 13px;
      }
      .callout {
        padding: 14px 17px;
        border-radius: 7px;
        background: #eef5f5;
        color: #47656a;
        font-size: 12px;
        line-height: 1.7;
        display: flex;
        gap: 10px;
      }
      .callout.warm {
        background: #fbf5e9;
        color: #8c662a;
      }
      .section-footer {
        border-top: 1px solid var(--line);
        padding: 17px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-footer small {
        font-size: 11px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin: 28px 0 14px;
      }
      .list-header h3 {
        margin: 0;
      }
      .entity-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 15px 17px;
        margin: 9px 0;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .entity-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--light);
        border-radius: 7px;
        color: var(--teal);
        flex-shrink: 0;
      }
      .entity-content {
        flex: 1;
        min-width: 0;
      }
      .entity-content strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }
      .entity-content small {
        font-size: 11px;
        line-height: 1.6;
        display: block;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.25fr repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 20px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .stat.total {
        background: var(--nav);
        color: white;
        border-color: var(--nav);
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat.total .stat-label {
        color: #bbced0;
      }
      .stat-value {
        font-size: 31px;
        font-weight: 650;
        letter-spacing: -1px;
        margin: 12px 0 3px;
      }
      .stat-sub {
        font-size: 10px;
        color: var(--muted);
      }
      .stat.total .stat-sub {
        color: #9ab5b8;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.1px;
        font-weight: 700;
        padding: 4px 8px;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sev-Critical {
        background: #fbeaed;
        color: var(--critical);
      }
      .sev-High {
        background: #fff0e4;
        color: var(--high);
      }
      .sev-Medium {
        background: #fbf4d9;
        color: var(--medium);
      }
      .sev-Low {
        background: #eaf3fc;
        color: var(--low);
      }
      .sev-Informational {
        background: #edf1f4;
        color: var(--info);
      }
      .neutral {
        background: #eef3f3;
        color: #61767b;
      }
      .good {
        background: var(--light);
        color: var(--teal);
      }
      .analysis-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 22px;
        align-items: start;
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .filters input:not([type="checkbox"]) {
        flex: 2;
        min-width: 150px !important;
      }
      .filters select {
        width: auto;
        flex: 1;
        min-width: 115px;
      }
      .filters label {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .risk-list {
        padding: 0 20px;
      }
      .risk-card {
        padding: 21px 0;
        border-bottom: 1px solid var(--line);
      }
      .risk-card:last-child {
        border: 0;
      }
      .risk-card-top {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .risk-card h3 {
        font-size: 14px;
        line-height: 1.55;
        margin: 8px 0 7px;
      }
      .risk-link {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        display: inline;
        font-weight: 650;
        line-height: inherit;
      }
      .risk-link:hover {
        background: transparent;
        color: var(--teal);
        text-decoration: underline;
      }
      .risk-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 13px;
      }
      .risk-meta {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 10px;
        color: var(--muted);
      }
      .risk-id {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .risk-trigger {
        font-size: 11px;
        background: #f4f7f7;
        padding: 9px 11px;
        border-radius: 5px;
        margin: 12px 0;
        color: #547076;
      }
      .family-overview {
        padding: 19px;
      }
      .family-overview h3 {
        font-size: 13px;
        margin-bottom: 7px;
      }
      .family-overview > p {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .family-button {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        padding: 10px 0;
        border-radius: 0;
        text-align: left;
        font-weight: 500;
      }
      .family-button:hover,
      .family-button.active {
        background: #f2f7f5;
      }
      .family-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
      }
      .family-bar {
        height: 4px;
        margin-top: 7px;
        border-radius: 3px;
        background: #eff2f1;
        overflow: hidden;
        display: flex;
      }
      .family-bar span {
        height: 100%;
      }
      .empty {
        padding: 45px 25px;
        text-align: center;
      }
      .empty-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--light);
        color: var(--teal);
        border-radius: 14px;
        margin: 0 auto 18px;
      }
      .empty-icon svg {
        width: 26px;
        height: 26px;
      }
      .empty h3 {
        font-size: 17px;
      }
      .empty p {
        color: var(--muted);
        max-width: 420px;
        margin: 0 auto 20px;
        font-size: 13px;
      }
      .empty .actions {
        justify-content: center;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .list-count {
        font-size: 11px;
        color: var(--muted);
        padding: 13px 20px;
        border-bottom: 1px solid var(--line);
      }
      .action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 20px;
      }
      .action-card {
        padding: 19px;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }
      .action-card h3 {
        font-size: 13px;
        line-height: 1.6;
        margin: 13px 0 8px;
      }
      .action-card p {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 16px;
      }
      .action-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .action-fields .field-label {
        font-size: 10px;
        margin-bottom: 6px;
      }
      .action-fields input,
      .action-fields select {
        font-size: 11px;
        padding: 8px !important;
      }
      .action-fields textarea {
        font-size: 11px;
        min-height: 55px;
        padding: 8px;
      }
      .action-card footer {
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .overdue {
        color: var(--critical) !important;
      }
      .library-list {
        padding: 0 22px;
      }
      .library-list details {
        border-bottom: 1px solid var(--line);
        padding: 18px 0;
      }
      .library-list details:last-child {
        border: 0;
      }
      .library-list summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .library-list summary::-webkit-details-marker {
        display: none;
      }
      .library-list summary strong {
        font-size: 13px;
        flex: 1;
        line-height: 1.5;
      }
      .library-detail {
        padding: 17px 0 0 30px;
        font-size: 12px;
        color: var(--muted);
      }
      .library-detail ul {
        padding-left: 18px;
        line-height: 1.9;
      }
      .library-detail .condition {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        padding: 10px;
        background: #f3f6f5;

      .recommendation .action-fields {

      .recommendation .action-fields .wide {
        grid-column: 1/-1;
      }
      .toast {
        position: fixed;
        bottom: 24px;

        border-radius: 8px;
        background: var(--nav);

        font-size: 12px;

      .storage-warning {

      .intro-banner {

        font-size: 12px;

      .intro-banner strong {

      .intro-banner button {

      .step-pill {

        padding: 6px 9px;
        border-radius: 5px;

      .library-summary {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 20px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      #print-root {
        display: none;
      }
      label .optional {
        font-weight: 400;
        color: var(--muted);
      }
      .mobile-brand {
        display: none;
      }
      .flow-arrow {
        color: var(--teal);
        margin: 0 5px;
      }
      .required-note {

        .panel-head {

        }
        .top-tools {
          margin: 0;

        }

          gap: 12px;

        .nav button {
          font-size: 11px;

        .nav button svg {
          width: 15px;
        }
        .heading-actions button {
          font-size: 11px;
        }
        .section-footer {
          gap: 8px;
          padding: 15px;
        }
        .section-footer small {
          display: none;
        }
        .dialog-body {
          padding: 18px;
        }
        .dialog-head {
          padding: 18px;
        }
        .intro-banner {
          padding: 16px;
        }
        .action-grid {
          padding: 12px;
        }
        .action-card {
          padding: 15px;
        }

      @page {
        size: A4;
        margin: 16mm;
      }
      @media print {
        body {
          background: white;
          font-size: 10pt;
          color: #172e34;
        }
        .shell,
        dialog,
        .toast,
        .storage-warning {
          display: none !important;
        }
        #print-root {
          display: block !important;
        }
        #print-root h1 {
          font-size: 24pt;
        }
        #print-root h2 {
          font-size: 15pt;
          border-bottom: 1px solid #bbcaca;
          padding-bottom: 7px;
          margin-top: 25px;
        }
        #print-root h3 {
          font-size: 11pt;
          margin-bottom: 7px;
        }
        #print-root p,
        #print-root li {
          font-size: 9pt;
          line-height: 1.6;
        }
        #print-root .report-risk {
          break-inside: avoid;
          border: 1px solid #d8e0e0;
          border-radius: 6px;
          padding: 13px;
          margin: 12px 0;
        }
        #print-root .report-meta {
          color: #52696e;
          font-size: 9pt;
        }
        #print-root table {
          border-collapse: collapse;
          width: 100%;
          font-size: 8pt;
        }
        #print-root th,
        #print-root td {
          border-bottom: 1px solid #ddd;
          padding: 7px;
          text-align: left;
          vertical-align: top;
          overflow-wrap: anywhere;
        }
        #print-root tr {
          break-inside: avoid;
        }
        #print-root ul {
          padding-left: 18px;
        }
        #print-root .badge {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        #print-root .report-section {
          break-before: page;
        }
        #print-root .report-note {
          border-left: 3px solid #12786e;
          padding-left: 10px;
        }
        #print-root pre {
          white-space: pre-wrap;
          font: inherit;
        }

      /* Version 2: process cockpit, reusable controls, and the evidence map. */
      .cockpit-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 20px;
        margin: 22px 0;
      }
      .cockpit-grid .span-all {
        grid-column: 1/-1;
      }
      .cockpit-card {
        padding: 22px;
      }
      .cockpit-card h2 {
        font-size: 16px;
      }
      .cockpit-card p {
        font-size: 12px;
        color: var(--muted);
      }
      .cockpit-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .cockpit-top h2 {
        margin: 0;
      }
      .cockpit-big {
        font-size: 30px;
        letter-spacing: -1px;
        font-weight: 700;
      }
      .phase-timeline {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0;
        padding: 23px 16px;
      }
      .phase {
        position: relative;
        padding: 0 10px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .phase:last-child {
        border: 0;
      }
      .phase-step {
        width: 24px;
        height: 24px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 11px;
        background: #f1f5f4;
        margin-bottom: 12px;
      }
      .phase.completed .phase-step {
        background: var(--teal);
        color: white;
        border-color: var(--teal);
      }
      .phase.active .phase-step {
        color: var(--teal);
        border-color: var(--teal);
        box-shadow: 0 0 0 4px #12786e0b;
      }
      .phase strong {
        font-size: 11px;
        display: block;
        margin-bottom: 8px;
        line-height: 1.5;
      }
      .phase select {
        font-size: 10px;
        padding: 7px 5px;
        width: 100%;
        margin-top: 8px;
      }
      .phase small {
        font-size: 9px;
        display: block;
        line-height: 1.5;
        margin-top: 6px;
      }
      .metric-row {
        display: grid;
        grid-template-columns: 110px minmax(40px, 1fr) 35px;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        margin: 16px 0;
      }
      .metric-row .progress-track {
        margin: 0;
        height: 6px;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 18px 0;
      }
      .status-grid div {
        background: #f5f8f7;
        padding: 12px;
        border-radius: 7px;
      }
      .status-grid strong {
        font-size: 22px;
        display: block;
      }
      .status-grid small {
        font-size: 10px;
      }
      .task-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .task-row:last-child {
        border: 0;
      }
      .task-row .task-main {
        min-width: 0;
        flex: 1;
      }
      .task-row strong,
      .task-row .risk-link {
        font-size: 12px;
        line-height: 1.65;
      }
      .task-row p {
        font-size: 11px;
        margin: 4px 0 7px;
        line-height: 1.6;
      }
      .task-row .badge {
        font-size: 9px;
      }
      .task-row .small {
        font-size: 10px;
      }
      .owner-mark {
        display: grid;
        place-items: center;
        background: var(--light);
        color: var(--teal);
        min-width: 27px;
        height: 27px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 700;
      }
      .owner-mark.project {
        background: #ecf1fa;
        color: #386c9c;
      }
      .blocker-table {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 24px;
      }
      .panel-scroll {
        max-height: 400px;
        overflow: auto;

      .comment-card {

        border-radius: 7px;
        padding: 15px;

      .comment-card p {

      .comment-meta {

        gap: 8px;

        flex-wrap: wrap;

      }
      .comment-tools {
        margin-left: auto;

        gap: 4px;

      .reco-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 20px;

      .reco-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        min-width: 0;
      }
      .reco-card h3 {
        font-size: 13px;
        line-height: 1.6;

      .reco-card p {
        font-size: 12px;

        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 14px;

      .mapped-row {
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;

      .mapped-row:last-child {
        border: 0;

      .mapped-row > div {
        flex: 1;
        min-width: 0;

      .mapped-row p {
        font-size: 11px;

      .mapped-row .risk-link {
        font-size: 12px;

      .mapping-picker {
        max-height: 330px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin-top: 14px;
        padding: 0 13px;
      }
      .mapping-picker label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        line-height: 1.6;
      }
      .mapping-picker input {
        flex-shrink: 0;
        margin-top: 3px;
      }
      .mapping-picker small {
        font-size: 10px;
        display: block;
      }
      .map-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 265px;
        gap: 18px;
        align-items: start;
      }
      .map-side {
        padding: 20px;
        position: sticky;
        top: 105px;
      }
      .map-side h2 {
        font-size: 15px;
        line-height: 1.6;
      }
      .map-side p {
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--muted);
      }
      .map-side ul {
        padding-left: 17px;
        font-size: 11px;
        line-height: 1.9;
      }
      .map-viewport {
        overflow: auto;
        max-height: 750px;
        min-height: 490px;
        background-color: #f8faf9;
        background-image: radial-gradient(#d9e5e2 0.8px, transparent 0.8px);
        background-size: 16px 16px;
        border-radius: 0 0 10px 10px;
      }
      .map-scale-space {
        position: relative;
      }
      .map-canvas {
        position: relative;
        transform-origin: top left;
      }
      .map-edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .map-edge {
        stroke: #b7c9c5;
        stroke-width: 1.3;
        fill: none;
      }
      .map-edge.emphasis {
        stroke: var(--teal);
        stroke-width: 2.3;
      }
      .map-edge.dim {
        opacity: 0.08;
      }
      .map-node {
        position: absolute;
        display: block;
        justify-content: initial;
        text-align: left;
        padding: 11px 13px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 3px 12px #17353c08;
        transition:
          opacity 0.15s,
          border-color 0.15s;
        white-space: normal;
        background: white;
      }
      .map-node:hover {
        background: #f1f8f5;
        border-color: var(--teal);
      }
      .map-node.selected {
        outline: 3px solid #0c776b;
        outline-offset: 3px;
      }
      .map-node.dim {
        opacity: 0.22;
      }
      .map-node strong {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 11px;
        line-height: 1.5;
        letter-spacing: 0;
      }
      .map-node .node-kicker {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 8px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;

      .node-kicker svg {
        width: 12px;
        height: 12px;
      }
      .map-node.project {
        background: var(--nav);
        color: white;
        border-color: var(--nav);
      }
      .map-node.project .node-kicker {
        color: #b1d0ca;
      }
      .map-node.risk {
        border-left: 4px solid var(--high);
      }
      .map-node.recommendation {
        border-left: 4px solid var(--teal);
        background: #f2faf6;
      }
      .map-node.risk.Critical {
        border-left-color: var(--critical);
      }
      .map-node.risk.Medium {
        border-left-color: var(--medium);
      }
      .map-node.risk.Low {
        border-left-color: var(--low);
      }
      .map-node.risk.Informational {
        border-left-color: var(--info);
      }
      .map-layer-label {
        position: absolute;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.6px;
        color: #78918e;
      }

        gap: 5px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .map-tools small {
        margin-right: auto;
        font-size: 11px;
      }
      .map-type-filters {

        padding: 12px 16px;

      }

        align-items: center;
        gap: 5px;
        font-size: 10px;
      }
      .map-type-filters input {
        width: 13px;
        height: 13px;
      }
      .inline-note {
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
        margin: 12px 0;
      }

        gap: 24px;

      .next-columns h3 {
        font-size: 12px;
        margin: 18px 0 4px;

        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;

    <script>
      "use strict";

      const bool = (key, label, show) => ({ key, label, type: "bool", show });

        label,
        type: "multi",
        options,
        show,
        wide: true,
      });
      const yes = (key) => (s) => s.answers[key] === "yes";
      const either =
        (...keys) =>
        (s) =>
          keys.some((k) => s.answers[k] === "yes");
      const hasComponent =
        (...values) =>

          values.some((v) => s.answers.components?.includes(v));
      const machineContext = (s) =>
        inventoryRows(s, "profiles").some((r) =>

        inventoryRows(s, "flows").some(

            /machine|application-to-application/i.test(r.context) ||
            /api key|service account|workload/i.test(r.authentication),
        );
      const secretContext = (s) => s.answers.secrets === "yes";
      const aiContext = yes("ai");
      const sections = [
        {
          id: "general",
          title: "General information",

              type: "textarea",

            text("owner", "Project owner / team", "Name or team"),
            select("environment", "Environment", [
              "On-premises",
              "Cloud",
              "SaaS",
              "Hybrid",
            ]),
            select("projectType", "Project type", [
              "New project",
              "Evolution of an existing system",
            ]),
            select("criticality", "Business criticality", [
              "Low",
              "Medium",
              "High",
              "Critical",
            ]),
          ],
        },
        {
          id: "architecture",
          title: "Architecture & components",
          description:
            "Select the building blocks in scope. Components activate relevant security review areas.",
          fields: [
            multi("components", "Project components", COMPONENTS),
            text(
              "architectureNotes",
              "Architecture notes",
              "Trust boundaries, integrations and deployment model",
            ),
          ],
        },
        {
          id: "network",
          title: "Network flows",
          description:
            "Map communications and trust boundaries. Add specific flows to capture authentication and encryption evidence.",
          fields: [
            bool("network", "Network communications"),
            bool("internalComms", "Internal communications", yes("network")),
            bool("internetComms", "Internet communications", yes("network")),
            bool("inbound", "Inbound Internet flows", yes("network")),
            bool("outbound", "Outbound Internet flows", yes("network")),
            bool("partnerComms", "Partner communications", yes("network")),
            bool("saasComms", "SaaS communications", yes("network")),
            bool(
              "appComms",
              "Application-to-application communications",
              yes("network"),

            bool("apiFlows", "API communications", yes("network")),
            bool("m2m", "Machine-to-Machine communications", yes("network")),
            text(

              "Protocols used",

            bool("dmz", "DMZ / isolated ingress zone", yes("network")),
            bool("crossZone", "Cross-zone flows", yes("network")),

            bool(
              "restrictFlows",
              "Flows limited to necessary sources and ports",
              yes("network"),

            bool("egressControl", "Outbound traffic filtering", yes("network")),

        },
        {
          id: "data",
          title: "Data & classification",
          description:
            "Describe data sensitivity, hosting and lifecycle. An unanswered control stays unknown; it is never treated as a confirmed absence.",

            bool("data", "Processes or stores data"),
            multi(
              "dataClasses",

      const AUTH_OPTIONS = [

      const SERVICE_PORTS = {

      /* Evidence graph: nodes and edges use the engine's triggeredBy and catalogue mappings. */
      const MAP_TYPES = [
        "Components",

        "Data",
        "Identities",
        "Third Parties",
        "Risks",
        "Recommendations",

      function buildProjectGraph(s, filters = {}) {
        let risks = evaluateRisks(s).filter(
          (r) =>
            !r.hidden &&
            r.status !== "Not Applicable" &&
            (filters.resolved ||
              !["Mitigated", "Accepted"].includes(r.status)) &&
            (filters.scope === "all" || r.status !== "To Be Confirmed") &&
            (!filters.severity || r.severity === filters.severity) &&
            (filters.severity || r.severity !== "Low" || filters.showLow) &&
            (filters.severity ||

              filters.showInfo) &&
            (!filters.riskFamily || r.family === filters.riskFamily),
        );

          library = allRecommendations(s);

          const rec = library.find((c) => c.id === id),
            action = getAction(s, risk, id);
          return (
            rec &&
            rec.active !== false &&
            (filters.allRecommendations ||
              action.selected ||
              filters.status === "Not retained in plan") &&
            (!filters.recommendationFamily ||
              rec.family === filters.recommendationFamily) &&
            (!filters.status ||
              (filters.status === "Not retained in plan"
                ? !action.selected
                : action.status === filters.status))
          );
        };
        if (filters.recommendationFamily || filters.status)
          risks = risks.filter((r) =>
            mappedRecommendationIds(s, r.id).some((id) => recMatches(id, r)),
          );
        const root = {
            id: "project-root",
            type: "Project",
            label: s.answers.name || "Untitled project",
            detail: s.answers.description || "No description recorded.",
            link: "project:root",
          },
          nodes = [root],
          edges = [];
        const addNode = (n) => {
            if (!nodes.some((v) => v.id === n.id)) nodes.push(n);
          },
          edge = (from, to) => {
            if (!edges.some((e) => e.from === from && e.to === to))
              edges.push({ from, to });
          };
        risks.forEach((r) => {
          const riskNode = {
            id: "risk-" + r.id,
            type: "Risks",
            label: r.title,
            detail: r.description,
            severity: r.severity,
            status: r.status,
            riskId: r.id,
            link: "risk:" + r.id,
            reasons: r.reasons,
          };
          addNode(riskNode);
          if (!r.triggeredBy.length) edge(root.id, riskNode.id);
          r.triggeredBy.forEach((t) => {
            const element = elements.find((e) => e.id === t.id);
            if (element) {
              addNode({ ...element, reason: t.reason });
              edge(root.id, element.id);
              edge(element.id, riskNode.id);
            }
          });
          mappedRecommendationIds(s, r.id)
            .filter((id) => recMatches(id, r))
            .forEach((id) => {
              const rec = library.find((c) => c.id === id);
              addNode({
                id: "recommendation-" + id,
                type: "Recommendations",
                label: rec.title,
                detail: rec.implementationGuidance,
                recommendationId: id,
                link: "recommendation:" + id,

        const mainIds = new Set([
          ...(s.answers.components || []).map((v) =>
            stableEntityId("component", v, s),
          ),
          ...s.flows.map((r) => r.id),
          ...s.profiles
            .filter((r) => filters.technical || !MACHINE_TYPES.includes(r.type))
            .map((r) => r.id),
          ...s.thirdParties.map((r) => r.id),
          ...s.dataTypes.map((r) => r.id),
        ]);
        for (const element of elements.filter((e) => mainIds.has(e.id))) {
          addNode(element);
          edge(root.id, element.id);
        }
        for (const flow of inventoryRows(s, "flows"))
          for (const key of ["source", "destination", "dataType"]) {
            const ref = flow[key + "Ref"] || matchReference(s, key, flow[key]);
            if (
              ref &&
              nodes.some((n) => n.id === ref) &&
              nodes.some((n) => n.id === flow.id)
            )
              edge(ref, flow.id);
          }
        if (!filters.technical) {
          const hidden = new Set(
            s.profiles
              .filter((r) => MACHINE_TYPES.includes(r.type))
              .map((r) => r.id),
          );
          for (let i = nodes.length - 1; i >= 0; i--)
            if (hidden.has(nodes[i].id)) nodes.splice(i, 1);
          for (let i = edges.length - 1; i >= 0; i--)
            if (hidden.has(edges[i].from) || hidden.has(edges[i].to))
              edges.splice(i, 1);
        }
        let result = { nodes, edges };
        const q = (filters.search || "").trim().toLowerCase();
        if (q) {
          const matches = nodes.filter((n) =>
            [n.id, n.label, n.detail].join(" ").toLowerCase().includes(q),
          );
          const keep = new Set();
          matches.forEach((n) =>
            relatedGraphNodes(result, n.id).forEach((id) => keep.add(id)),
          );
          result = {
            nodes: nodes.filter((n) => keep.has(n.id)),
            edges: edges.filter((e) => keep.has(e.from) && keep.has(e.to)),
          };
        }
        if (filters.types) {
          const keep = new Set(
            result.nodes
              .filter(
                (n) => n.type === "Project" || filters.types.includes(n.type),
              )
              .map((n) => n.id),
          );
          result = {
            nodes: result.nodes.filter((n) => keep.has(n.id)),
            edges: result.edges.filter(
              (e) => keep.has(e.from) && keep.has(e.to),
            ),
          };
        }
        return result;
      }
      function relatedGraphNodes(graph, id) {
        const seen = new Set([id]);
        function walk(direction) {
          const visited = new Set([id]),
            queue = [id];

            const current = queue.shift();
            for (const e of graph.edges) {

                direction === "up"
                  ? e.to === current
                    ? e.from
                    : null
                  : e.from === current
                    ? e.to
                    : null;
              if (target && !visited.has(target)) {
                visited.add(target);
                seen.add(target);
                queue.push(target);
              }
            }
          }
        }
        walk("up");
        walk("down");

      }

      function renderMapResults() {
        const target = $("#map-results");
        if (!target) return;
        const graph = buildProjectGraph(state, {
          scope: ui.mapScope,
          showLow: ui.mapLow,
          showInfo: ui.mapInfo,
          allRecommendations: ui.mapAllRecommendations,
          technical: ui.mapTechnical,
          resolved: ui.mapResolved,
          severity: ui.mapSeverity,
          riskFamily: ui.mapRiskFamily,
          recommendationFamily: ui.mapRecommendationFamily,
          status: ui.mapStatus,
          search: ui.mapSearch,
          types: ui.mapTypes,
        });
        ui.currentGraph = graph;
        const selected = graph.nodes.find((n) => n.id === ui.mapSelected),
          related = selected ? relatedGraphNodes(graph, selected.id) : null;
        const layers = [
            graph.nodes.filter((n) => n.type === "Project"),
            graph.nodes.filter(
              (n) => !["Project", "Risks", "Recommendations"].includes(n.type),
            ),
            graph.nodes.filter((n) => n.type === "Risks"),
            graph.nodes.filter((n) => n.type === "Recommendations"),
          ],
          titles = [
            "PROJECT",
            "PROJECT ELEMENTS / MATCHED FACTS",
            "IDENTIFIED RISKS",
            "MAPPED RECOMMENDATIONS",
          ];
        const positions = new Map(),
          labels = [];
        const width = 1080,
          nodeWidth = 236,
          nodeHeight = 96,
          gap = 20,
          cols = 4;
        let y = 24;
        layers.forEach((nodes, layer) => {
          if (!nodes.length) return;
          labels.push({ title: titles[layer], y });
          y += 30;
          const rows = Math.ceil(nodes.length / cols);
          nodes.forEach((n, i) => {
            const row = Math.floor(i / cols),
              inRow = Math.min(cols, nodes.length - row * cols),
              x =
                (width - inRow * nodeWidth - (inRow - 1) * gap) / 2 +
                (i % cols) * (nodeWidth + gap);
            positions.set(n.id, {
              x,
              y: y + row * (nodeHeight + 20),
              w: nodeWidth,
              h: nodeHeight,
            });
          });
          y += rows * (nodeHeight + 20) + 66;
        });
        const height = Math.max(y, 440);
        const paths = graph.edges
          .map((e) => {
            const a = positions.get(e.from),
              b = positions.get(e.to);
            if (!a || !b) return "";
            const x = a.x + a.w / 2,
              x2 = b.x + b.w / 2,
              from = a.y + a.h,
              to = b.y,
              mid = (from + to) / 2;
            return `<path class="map-edge ${related ? (related.has(e.from) && related.has(e.to) ? "emphasis" : "dim") : ""}" d="M${x},${from} C${x},${mid} ${x2},${mid} ${x2},${to}" marker-end="url(#map-arrow)"/>`;
          })
          .join("");
        $("#map-counts").textContent =
          `${graph.nodes.length} nodes · ${graph.edges.length} links · ${graph.nodes.filter((n) => n.type === "Risks").length} risks`;
        $("#map-zoom-label").textContent = Math.round(ui.mapZoom * 100) + "%";
        target.innerHTML = graph.nodes.length
          ? `<div class="map-scale-space" style="width:${width * ui.mapZoom}px;height:${height * ui.mapZoom}px"><div class="map-canvas" style="width:${width}px;height:${height}px;transform:scale(${ui.mapZoom})"><svg class="map-edges" viewBox="0 0 ${width} ${height}" aria-hidden="true"><defs><marker id="map-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#819d94"/></marker></defs>${paths}</svg>${labels.map((l) => `<div class="map-layer-label" style="left:30px;top:${l.y}px">${l.title}</div>`).join("")}${graph.nodes
              .map((n) => {
                const p = positions.get(n.id),
                  kind =
                    n.type === "Project"
                      ? "project"
                      : n.type === "Risks"
                        ? "risk"
                        : n.type === "Recommendations"
                          ? "recommendation"
                          : "context";
                return `<button class="map-node ${kind} ${n.severity || ""} ${selected?.id === n.id ? "selected" : ""} ${related && !related.has(n.id) ? "dim" : ""}" data-map-node="${esc(n.id)}" aria-label="${esc(n.type + ": " + n.label)}" aria-pressed="${selected?.id === n.id}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px"><span class="node-kicker">${icon(kind === "risk" ? "shield" : kind === "recommendation" ? "check" : kind === "project" ? "layers" : "flow")}${esc(n.type)}${n.severity ? " · " + esc(n.severity) : ""}</span><strong>${esc(n.label)}</strong></button>`;
              })
              .join("")}</div></div>`
          : emptyHTML(
              "No matching relationships",
              "Change the filters or include risks awaiting confirmation.",
            );
        $("#map-details").innerHTML = selected
          ? `<div class="eyebrow">${esc(selected.type)}</div><h2>${esc(selected.label)}</h2>${selected.severity ? badge(selected.severity) : ""}<p style="margin-top:14px">${esc(selected.detail)}</p>${selected.reasons ? `<h3>Why it was identified</h3><ul>${selected.reasons.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : selected.reason ? `<p><strong>Matched fact</strong><br>${esc(selected.reason)}</p>` : ""}<p>${related.size - 1} connected nodes highlighted. Unrelated nodes are dimmed.</p><button class="primary small" data-follow-link="${esc(selected.link)}">Open details ${icon("arrow")}</button><div style="margin-top:14px"><span class="risk-id">${esc(selected.id)}</span></div>`
          : `<div class="eyebrow">FOLLOW THE EVIDENCE</div><h2>A connected assessment</h2><p>Select a project element, risk or recommendation to highlight its upstream and downstream relationships.</p><ul><li>Project → recorded context</li><li>Context → matched rule evidence</li><li>Risk → editable recommendation mappings</li></ul><p>Every edge comes from the assessment model. Type filters can hide intermediate nodes and their edges.</p>`;
      }

      function openRecord(type, index) {

      /* Import, export, report and demo data. */
      function exportProject() {
        const output = {
          ...state,
          updatedAt: state.updatedAt || new Date().toISOString(),
          project: {
            name: state.answers.name || "",
            description: state.answers.description || "",
            owner: state.answers.owner || "",
          },
          risks: evaluateRisks(state),
          retainedRecommendations: activeActions(state),
        };
        const blob = new Blob([JSON.stringify(output, null, 2)], {
            type: "application/json",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download =
          (state.answers.name || "isp-assessment")
            .replace(/[^a-z0-9_-]+/gi, "-")
            .slice(0, 80) + ".json";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast("Project exported, including decisions and action details.");
      }
      async function importProject(file) {
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          toast("Import rejected: project files must be smaller than 5 MB.");
          return;
        }
        try {
          const parsed = normalizeProject(JSON.parse(await file.text()));
          pendingImport = parsed;
          confirmAction(
            "Load this assessment?",
            `Replace the current assessment with “${parsed.answers.name || "Untitled project"}”? Export your current work first if you need a backup.`,
            "import",
            "Load Project",
          );
        } catch (e) {
          toast("Import failed: " + e.message);
        }
      }

      const DERIVED_KEYS = new Set([
        "network",
        "identities",
        "thirdParty",
        "data",
        "dataClasses",
        "dataLocation",
        "confidentiality",
        "retention",
        "encryptedTransit",

      function deriveProjectContext(s) {
        const flows = inventoryRows(s, "flows"),
          profiles = inventoryRows(s, "profiles"),
          suppliers = inventoryRows(s, "thirdParties"),
          data = s.answers.data === "no" ? [] : s.dataTypes;
        const components = s.answers.components || [];
        const external = (r) =>
          /internet|external|saas|partner/i.test(
            [r.destination, r.context, r.exposure].join(" "),
          ) ||
          suppliers.some(
            (t) =>
              t.name && r.destination?.toLowerCase() === t.name.toLowerCase(),
          );
        const inbound = (r) =>
          /inbound|internet-exposed|internet to internal/i.test(
            r.context + " " + r.exposure,
          );
        const machine = (r) =>
          MACHINE_TYPES.includes(r.type) ||
          /machine|application-to-application/i.test(r.context || "") ||
          /service account|workload|managed identity|api key/i.test(
            r.authentication || "",
          );
        return {
          hasInternetFlows: flows.some(external),
          hasInboundInternet: flows.some(inbound),
          hasAPI:
            components.some((v) => /api/i.test(v)) ||
            flows.some(
              (r) =>
                /https|rest|api/i.test(r.protocol) ||
                /api|saas/i.test(r.context),
            ),
          hasM2M: flows.some(machine) || profiles.some(machine),
          hasServiceAccounts:
            profiles.some((r) => MACHINE_TYPES.includes(r.type)) ||
            flows.some((r) => /service account/i.test(r.authentication)),
          hasStaticCredentials: [...flows, ...profiles].some(
            (r) =>
              !/managed identity|workload identity/i.test(r.authentication) &&
              /api key|password|service account|token|ssh key/i.test(
                r.authentication,
              ),
          ),
          hasPrivilegedUsers: profiles.some(
            (r) => knownBoolean(r.privileged) === "yes",
          ),
          hasRemoteAccess:
            profiles.some(
              (r) =>
                /remote|internet|third-party|multiple/i.test(r.location) ||
                /vpn|ztna|ssh|rdp/i.test(r.accessMethod),
            ) || suppliers.some((r) => knownBoolean(r.remote) === "yes"),
          hasRemoteSupplierAccess:
            suppliers.some((r) => knownBoolean(r.remote) === "yes") ||
            profiles.some(
              (r) =>
                r.type === "Supplier" &&
                /remote|internet|third-party/i.test(r.location),
            ),
          hasSupplierData: suppliers.some(
            (r) =>
              documented(r.dataAccess) &&
              !uncertain(r.dataAccess) &&
              !["None", "Not Applicable"].includes(r.dataAccess),
          ),
          hasSensitiveData: data.length
            ? data.some(
                (r) =>
                  /high|critical/i.test(r.confidentiality) ||
                  /personal|sensitive|financial/i.test(r.classification),
              )
            : s.answers.dataClasses?.some((v) =>
                /personal|sensitive|financial|secret|regulated/i.test(v),
              ) || false,
          hasThirdParties: !!suppliers.length,
          hasFlows: !!flows.length,
          hasIdentities: !!profiles.length,
          hasData: !!data.length,
          hasHighDependency: suppliers.some((r) =>
            /high|critical/i.test(r.dependency),
          ),
          hasAI:
            components.some((v) =>
              /\bai\b|artificial intelligence|language model/i.test(v),
            ) || s.answers.ai === "yes",
          hasSaaS:
            components.some((v) => /saas/i.test(v)) ||
            flows.some((r) => /saas/i.test(r.context + " " + r.destination)) ||
            suppliers.some((r) => /saas/i.test(r.serviceType)),
          hasEncryptedTransport: flows.some((r) =>
            /tls|ssh|ipsec|^encrypted$/i.test(r.encryption),
          ),
        };
      }
      function derivedAnswer(key, s) {
        const c = deriveProjectContext(s),
          a = s.answers;
        const presence = {
          network: c.hasFlows,
          identities: c.hasIdentities,
          thirdParty: c.hasThirdParties,
          data: c.hasData,
        };
        if (own(presence, key)) return presence[key] ? "yes" : a[key];
        if (key === "webExposure" || key === "apiExposure") {
          const flows = inventoryRows(s, "flows"),
            kind = key === "apiExposure" ? /api/i : /web|portal|browser/i;
          const inbound = (r) =>
            /inbound|internet-exposed|internet to internal/i.test(
              r.context + " " + r.exposure,
            );
          if (
            flows.some(
              (r) => inbound(r) && kind.test(r.destination + " " + r.purpose),
            )
          )
            return "yes";
          if (
            flows.length &&
            flows.every((r) => documented(r.context) && !uncertain(r.context))
          )
            return "no";
          return a[key];
        }
        if (key === "criticalDependencies")

            (d) =>
              d.name &&
              d.name.toLowerCase() === String(value || "").toLowerCase(),
          )?.id || ""
        );
      }
      function linkFlowReferences(row, s) {
        for (const key of ["source", "destination", "dataType"])
          row[key + "Ref"] = matchReference(s, key, row[key]);
        return row;
      }
      function syncReferences(s) {
        const labels = new Map([
          ...(s.answers.components || []).map((v) => [
            stableEntityId("component", v, s),
            v,
          ]),
          ...s.thirdParties.map((r) => [r.id, r.name]),
          ...s.profiles.map((r) => [r.id, r.name]),
          ...s.dataTypes.map((r) => [r.id, r.name]),
        ]);
        for (const flow of s.flows)
          for (const key of ["source", "destination", "dataType"])
            if (flow[key + "Ref"] && labels.has(flow[key + "Ref"]))
              flow[key] = labels.get(flow[key + "Ref"]);
      }
      /* Capture only workshop-specific actions; existing catalogue and export handlers are retained. */
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el.dataset.draftField && ui.inventoryDraft) {
          const d = ui.inventoryDraft,
            k = el.dataset.draftField;
          d.row[k] = el.value;
          if (d.key === "flows" && k === "port") d.row.portAuto = false;
          if (
            d.key === "flows" &&
            k === "protocol" &&
            d.row.portAuto !== false
          ) {
            d.row.port = SERVICE_PORTS[el.value] || "";
            const p = $("#detail-flows-port");
            if (p) p.value = d.row.port;
          }
          const alert = $("#contextual-alerts");
          if (alert) alert.innerHTML = inventoryWarnings(d.key, d.row);
        }
        if (el.id === "paste-rows-text" && ui.pastePreview) {
          ui.pastePreview = null;
          $("#paste-preview").innerHTML =
            "<p>Paste changed. Preview again before import.</p>";
        }
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (
          el.dataset.draftField &&
          ["authentication", "type", "privileged", "dataAccess"].includes(
            el.dataset.draftField,
          )
        ) {
          const d = ui.inventoryDraft;
          if (!d || d.focusField) return;
          for (const node of document.querySelectorAll("[data-context-field]"))
            node.hidden =
              !isExpert() &&
              !inventoryFieldRelevant(d.key, d.row, node.dataset.contextField);
        }
        if (el.id === "paste-has-header" && ui.pastePreview) {
          ui.pastePreview = null;
          $("#paste-preview").innerHTML =
            "<p>Header option changed. Preview again.</p>";
        }
      });
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        if (b.dataset.stage) {
          ui.view = "qualification";
          ui.section = STAGES.find((s) => s.id === b.dataset.stage).sections[0];
          ui.openControls = "";
          ui.reviewSkipped = [];
          render();
          window.scrollTo(0, 0);
        }
        if (b.dataset.interfaceMode) {
          state.preferences.mode = b.dataset.interfaceMode;
          changed(true);
          if ($("#dialog").open && ui.inventoryDraft) renderInventoryDetail();
        }
        if (b.hasAttribute("data-edit-project")) {
          ui.projectEditing = true;
          render();
        }
        if (b.hasAttribute("data-edit-project-from-map")) {
          closeDialog();
          ui.view = "qualification";
          ui.section = "general";
          ui.projectEditing = true;
          render();
        }
        if (b.hasAttribute("data-finish-project")) {
          ui.projectEditing = false;
          render();
        }
        if (b.hasAttribute("data-component-picker")) openComponentPicker();
        if (b.dataset.componentDetail)
          openComponentDetail(b.dataset.componentDetail);
        if (b.dataset.removeComponent) {
          state.answers.components = (state.answers.components || []).filter(
            (v) => v !== b.dataset.removeComponent,
          );
          closeDialog();
          changed(true);
        }
        if (b.dataset.detail)
          openInventoryDetail(b.dataset.detail, b.dataset.id);
        if (b.dataset.templateKey) {
          const key = b.dataset.templateKey;
          openInventoryDetail(
            key,
            "",
            INVENTORY_TEMPLATES[key][Number(b.dataset.templateIndex)][1],
          );
        }
        if (b.dataset.emptyScope) {
          state.answers[INVENTORIES[b.dataset.emptyScope].scope] = "no";
          changed(true);
        }
        if (b.dataset.restoreInventory) {
          state.answers[INVENTORIES[b.dataset.restoreInventory].scope] = "yes";
          changed(true);
        }
        if (b.hasAttribute("data-no-data")) {
          state.answers.data = "no";
          changed(true);
        }
        if (b.hasAttribute("data-full-detail")) {
          ui.inventoryDraft.focusField = "";
          renderInventoryDetail();
        }
        if (b.hasAttribute("data-cancel-detail")) {
          const parent = ui.inventoryDraft?.returnTo;
          ui.inventoryDraft = null;
          if (parent) {
            ui.inventoryDraft = parent;
            renderInventoryDetail();
          } else {
            closeDialog();
            ui.reviewReturn = null;
          }
        }
        if (b.hasAttribute("data-inline-supplier")) {
          ui.inlineParent = ui.inventoryDraft;
          openInventoryDetail("thirdParties");
        }
        if (b.hasAttribute("data-inline-data")) {
          ui.inlineParent = ui.inventoryDraft;
          openDataAssetEditor();
        }
        if (b.hasAttribute("data-cancel-asset")) {
          const parent = ui.dataDraft?.parent;
          ui.dataDraft = null;
          if (parent) {
            ui.inventoryDraft = parent;
            renderInventoryDetail();
          } else closeDialog();
        }
        if (b.dataset.paste) openPasteRows(b.dataset.paste);
        if (b.hasAttribute("data-preview-paste")) renderPastePreview();
        if (b.hasAttribute("data-import-paste")) {
          const p = ui.pastePreview;
          if (!p) return;
          const rows = p.rows.filter(
            (r) =>
              r.status === "Valid" ||
              (r.status === "Requires confirmation" &&
                $("#paste-accept-uncertain").checked),
          );
          if (!rows.length) {
            toast(
              "No selected rows to import. Include rows requiring confirmation or correct the paste.",
            );
            return;
          }
          if (state[p.key].length + rows.length > 500) {
            toast("Import would exceed 500 records.");
            return;
          }
          for (const r of rows) {
            const row = { ...r.row, id: nextInventoryId(state, p.key) };
            if (p.key === "flows") linkFlowReferences(row, state);
            state[p.key].push(row);
          }
          state.answers[INVENTORIES[p.key].scope] = "yes";
          ui.pastePreview = null;
          closeDialog();
          changed(true);
          toast(rows.length + " records imported.");
        }
        if (b.hasAttribute("data-start-review")) startReview();
        if (b.hasAttribute("data-restart-review")) {
          ui.reviewSkipped = [];
          ui.reviewCurrent = "";
          render();
        }
        if (b.hasAttribute("data-review-skip")) skipReview();
        if (b.hasAttribute("data-review-confirm")) confirmReview();
        if (b.hasAttribute("data-review-ask"))
          askForReview(currentReviewItem());
        if (b.hasAttribute("data-review-details")) {
          const item = currentReviewItem();
          if (item) followLink(item.link);
        }
        if (b.dataset.reviewRisk) {
          const id = b.dataset.riskId,
            status = b.dataset.reviewRisk;
          state.decisions[id] = { ...(state.decisions[id] || {}), status };
          ui.reviewCurrent =
            status === "Applicable" ? "recommendations-" + id : "";
          changed(true);
        }
        if (b.dataset.controlDecision) {
          const key = b.dataset.controlKey;
          if (b.dataset.controlDecision === "Discuss") {
            const a = proposedActions(state).find((a) => a.key === key);
            if (a) {
              const id = "discuss-" + stableHash(key);
              if (!state.nextActions.some((n) => n.id === id))
                state.nextActions.push({
                  id,
                  side: "ISP",
                  title: "Discuss " + a.text,
                  description:
                    "Discuss this recommendation with the Project Team.",
                  link: "action:" + key,
                  status: "To Do",
                  owner: "",
                  due: "",
                });
              changed(false);
              if (ui.view === "review" || ui.section === "review") skipReview();
              else toast("Added to ISP Next Actions.");
            }
          } else {
            setAction(key, "decision", b.dataset.controlDecision);
            if (ui.view === "review" || ui.section === "review") render();
            else openRisk(key.split("::")[0]);
          }
        }
        if (b.hasAttribute("data-review-na")) {
          const item = currentReviewItem();
          if (!item || !canMarkNotApplicable(item)) return;
          showDialog(
            "Mark not applicable",
            `<form id="review-na-form"><p>${esc(humanize(item.title))}</p><label class="field"><span class="field-label">Reason</span><textarea name="reason" required maxlength="3000"></textarea></label><input type="hidden" name="link" value="${esc(item.link)}"></form>`,
            `<button data-close>Cancel</button><button class="primary" form="review-na-form" type="submit">Confirm Not Applicable</button>`,
          );
        }
        if (b.dataset.evidenceResult) {
          const item = currentReviewItem();
          if (item) {
            const comment = $("#queue-evidence-comment").value;
            setAction(item.actionKey, "consultantComment", comment);
            setAction(item.actionKey, "ispReview", b.dataset.evidenceResult);
            if (b.dataset.evidenceResult === "Changes Requested") {
              askForReview(item);
            } else render();
          }
        }
        if (b.dataset.mapPreset) {
          if (b.dataset.mapPreset === "all") {
            ui.mapLow = true;
            ui.mapInfo = true;
            ui.mapAllRecommendations = true;
            ui.mapTechnical = true;
            ui.mapResolved = true;
            ui.mapScope = "all";
          } else {
            resetMapFilters();
          }
          render();
        }
      });
      document.addEventListener(
        "submit",
        (event) => {
          const form = event.target;
          if (
            ![
              "inventory-detail-form",
              "asset-detail-form",
              "question-detail-form",
              "review-na-form",
            ].includes(form.id)
          )
            return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const data = new FormData(form);
          if (form.id === "inventory-detail-form") saveInventoryDraft();
          if (form.id === "asset-detail-form") {
            const d = ui.dataDraft;
            if (!d) return;
            const row = {
              id:
                d.index === undefined
                  ? newId("dataType")
                  : state.dataTypes[d.index].id,
              ...Object.fromEntries(
                recordFields.dataType.map(([k]) => [
                  k,
                  safeText(data.get(k), 3000).trim(),
                ]),
              ),
            };
            if (!row.name) return;
            if (d.index === undefined) {
              if (state.dataTypes.length >= 500) {
                toast("Data inventory limit reached.");
                return;
              }
              state.dataTypes.push(row);
            } else state.dataTypes[d.index] = row;
            state.answers.data = "yes";
            const parent = d.parent;
            ui.dataDraft = null;
            closeDialog();
            changed(true);
            if (parent) {
              parent.row.dataType = row.name;
              ui.inventoryDraft = parent;
              renderInventoryDetail();
            } else finishReviewConfirmation();
          }
          if (form.id === "question-detail-form") {
            const key = ui.questionDraft.key;
            state.answers[key] =
              fieldIndex[key].type === "multi"
                ? data.getAll("value")
                : safeText(data.get("value"));
            closeDialog();
            changed(true);
            finishReviewConfirmation();
          }
          if (form.id === "review-na-form") {
            const reason = safeText(data.get("reason"), 3000).trim();
            if (!reason) return;
            const link = data.get("link");
            if (link.startsWith("inventory:")) {
              const [, key, id, field] = link.split(":");
              const row = state[key].find((r) => r.id === id);
              if (row) {
                row[field] = "Not Applicable";
                row.comment = [
                  row.comment,
                  field + ": Not Applicable — " + reason,
                ]
                  .filter(Boolean)
                  .join("\n");
              }
            } else if (link.startsWith("question:")) {
              state.answers[link.slice(9)] = "na";
              state.comments.push({
                id: newId("COMMENT"),
                text:
                  "Not Applicable: " +
                  fieldIndex[link.slice(9)].label +
                  " — " +
                  reason,
                category: "Decision",
                author: "ISP Team",
                date: todayLocal(),
                link,
                pinned: false,
              });
            }
            closeDialog();
            changed(true);
          }
        },
        true,
      );
      function openActionDetail(key) {
        const a = proposedActions(state).find((a) => a.key === key);
        if (!a) {
          toast(
            "This control is outside the active plan. Its history remains saved.",
          );
          return;
        }
        showDialog(
          a.text,
          `<p>${esc(a.riskTitle)}</p><p class="inline-note">The Project Team implements the control. ISP reviews the supplied evidence independently.</p>${actionFields(a)}`,
          `<button class="quiet danger" data-remove-action="${esc(key)}">Remove from plan</button><button class="primary" data-close>Done</button>`,
        );
      }
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (b?.dataset.actionDetail) openActionDetail(b.dataset.actionDetail);
      });

      function cancelWorkshopDrawer() {
        let parent = null;
        if ($("#inventory-detail-form")) {
          parent = ui.inventoryDraft?.returnTo;
          ui.inventoryDraft = null;
        }
        if ($("#asset-detail-form")) {
          parent = ui.dataDraft?.parent;
          ui.dataDraft = null;
        }
        if (parent) {
          ui.inventoryDraft = parent;
          renderInventoryDetail();
          return true;
        }
        ui.reviewReturn = null;
        return false;
      }
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (b?.hasAttribute("data-close")) cancelWorkshopDrawer();
      });
      $("#dialog").addEventListener("cancel", (event) => {
        if (cancelWorkshopDrawer()) event.preventDefault();
      });

      restoreLocal();
      clearFilters();
      populateIcons();
      render();
    </script>
  </body>
</html>
