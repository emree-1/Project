<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ISP Assistant · Security assessment workspace</title>
    <style>
      /* 1. Presentation — all resources are embedded; no network access is used. */
      :root {
        --nav: #132b32;
        --nav-muted: #9eb4b8;
        --bg: #f4f6f6;
        --paper: #fff;
        --ink: #19343b;
        --muted: #65787d;
        --line: #dce5e5;
        --teal: #12786e;
        --light: #e8f4f0;
        --critical: #ae293e;
        --high: #b45e18;
        --medium: #946b08;
        --low: #226895;
        --info: #64737e;
        --shadow: 0 5px 20px #17353c06;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      a,
      input,
      select,
      textarea,
      summary {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #4ca89c;
      }
      button {
        color: inherit;
      }
      button.primary {
        background: var(--teal);
        color: white;
        border-color: var(--teal);
      }
      button.primary:hover {
        background: #0c625a;
      }
      button.danger {
        color: var(--critical);
      }
      button,
      .button {
        border: 1px solid var(--line);
        background: white;
        border-radius: 7px;
        padding: 9px 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        line-height: 1.25;
      }
      button:hover {
        background: #f1f6f5;
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
      }
      button.small {
        font-size: 12px;
        padding: 6px 9px;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.9px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      h3 {
        font-size: 15px;
      }
      p {
        line-height: 1.65;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.6px;
        font-size: 10px;
        font-weight: 750;
        color: var(--teal);
        margin-bottom: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--nav);
        color: white;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        letter-spacing: -0.4px;
        font-weight: 750;
        margin: 0 10px 34px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 38px;
        border-radius: 10px;
        background: #1c514f;
        color: #95dcc3;
      }
      .brand-mark svg {
        width: 24px;
        height: 24px;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 2px;
        display: block;
        font-weight: 500;
        color: var(--nav-muted);
        margin-top: 3px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.7px;
        color: var(--nav-muted);
        margin: 0 12px 10px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        background: transparent;
        border: 0;
        justify-content: flex-start;
        color: #b7c9cc;
        padding: 12px;
        border-radius: 7px;
        text-align: left;
        font-weight: 500;
      }
      .nav button.active {
        background: #24434a;
        color: white;
        box-shadow: inset 3px 0 #6dc3a7;
      }
      .nav button:hover {
        background: #203e45;
      }
      .nav button svg {
        margin-right: 4px;
      }
      .nav .count {
        margin-left: auto;
        font-size: 11px;
        background: #ffffff15;
        color: #dcece8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 32px 10px 0;
        color: #b7c9cc;
        font-size: 12px;
      }
      .local-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: #75c2a4;
      }
      .sidebar-bottom p {
        font-size: 11px;
        color: #90a9ae;
        margin: 0;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        min-height: 82px;
        background: #ffffffed;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 34px;
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(12px);
      }
      .project-caption {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .project-title {
        font-size: 14px;
        font-weight: 700;
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-progress {
        width: 130px;
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .progress-track {
        height: 4px;
        background: #e6eeed;
        border-radius: 4px;
        margin-top: 7px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        background: var(--teal);
        height: 100%;
        transition: width 0.2s;
      }
      .top-tools {
        display: flex;
        gap: 7px;
      }
      .top-tools button {
        font-size: 12px;
      }
      .export-wrap {
        position: relative;
      }
      .export-menu {
        position: absolute;
        right: 0;
        top: 44px;
        min-width: 205px;
        background: white;
        padding: 6px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px #14363c20;
        border-radius: 8px;
      }
      .export-menu button {
        display: flex;
        width: 100%;
        justify-content: flex-start;
        border: 0;
        padding: 11px;
      }
      .content {
        max-width: 1460px;
        margin: auto;
        padding: 34px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 27px;
      }
      .page-heading p {
        margin-bottom: 0;
        color: var(--muted);
        max-width: 700px;
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        box-shadow: var(--shadow);
      }
      .panel-head {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head h2 {
        margin-bottom: 5px;
      }
      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .panel-body {
        padding: 24px;
      }
      .qualification-layout {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .section-nav {
        padding: 10px;
        position: sticky;
        top: 108px;
      }
      .section-nav button {
        width: 100%;
        border: 0;
        text-align: left;
        justify-content: flex-start;
        font-size: 12px;
        font-weight: 500;
        padding: 11px 10px;
        background: transparent;
        gap: 10px;
        margin: 1px 0;
      }
      .section-nav button.active {
        background: var(--light);
        color: #086a60;
        font-weight: 700;
      }
      .section-nav .section-number {
        font-size: 10px;
        min-width: 20px;
        color: var(--muted);
      }
      .section-nav .check {
        margin-left: auto;
        color: var(--teal);
        font-size: 12px;
      }
      .section-description {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 25px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .field {
        display: block;
        min-width: 0;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field-label {
        font-size: 12px;
        font-weight: 650;
        display: block;
        margin-bottom: 9px;
      }
      .field-help {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: block;
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        width: 100%;
        border: 1px solid #cddbdc;
        border-radius: 6px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        min-width: 0;
      }
      input::placeholder,
      textarea::placeholder {
        color: #93a0a3;
      }
      textarea {
        resize: vertical;
        min-height: 86px;
        line-height: 1.6;
      }
      input[type="checkbox"] {
        accent-color: var(--teal);
        width: 16px;
        height: 16px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 6px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }
      .chip:has(input:checked) {
        border-color: #5ca89a;
        background: var(--light);
        color: #09675d;
      }
      .chip input {
        margin: 0;
      }
      .segmented {
        display: flex;
        gap: 0;
        width: max-content;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented label {
        position: relative;
        cursor: pointer;
        font-size: 11px;
        display: block;
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .segmented span {
        display: block;
        padding: 9px 12px;
        border-right: 1px solid var(--line);
        background: white;
      }
      .segmented label:last-child span {
        border: 0;
      }
      .segmented input:checked + span {
        background: var(--light);
        color: #09675d;
        font-weight: 700;
      }
      .segmented input:focus-visible + span {
        outline: 3px solid var(--teal);
        outline-offset: -3px;
      }
      .form-divider {
        grid-column: 1/-1;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        margin-top: 8px;
        font-weight: 650;
        font-size: 13px;
      }
      .callout {
        padding: 14px 17px;
        border-radius: 7px;
        background: #eef5f5;
        color: #47656a;
        font-size: 12px;
        line-height: 1.7;
        display: flex;
        gap: 10px;
      }
      .callout.warm {
        background: #fbf5e9;
        color: #8c662a;
      }
      .section-footer {
        border-top: 1px solid var(--line);
        padding: 17px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-footer small {
        font-size: 11px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin: 28px 0 14px;
      }
      .list-header h3 {
        margin: 0;
      }
      .entity-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 15px 17px;
        margin: 9px 0;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .entity-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--light);
        border-radius: 7px;
        color: var(--teal);
        flex-shrink: 0;
      }
      .entity-content {
        flex: 1;
        min-width: 0;
      }
      .entity-content strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }
      .entity-content small {
        font-size: 11px;
        line-height: 1.6;
        display: block;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.25fr repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 20px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .stat.total {
        background: var(--nav);
        color: white;
        border-color: var(--nav);
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat.total .stat-label {
        color: #bbced0;
      }
      .stat-value {
        font-size: 31px;
        font-weight: 650;
        letter-spacing: -1px;
        margin: 12px 0 3px;
      }
      .stat-sub {
        font-size: 10px;
        color: var(--muted);
      }
      .stat.total .stat-sub {
        color: #9ab5b8;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.1px;
        font-weight: 700;
        padding: 4px 8px;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sev-Critical {
        background: #fbeaed;
        color: var(--critical);
      }
      .sev-High {
        background: #fff0e4;
        color: var(--high);
      }
      .sev-Medium {
        background: #fbf4d9;
        color: var(--medium);
      }
      .sev-Low {
        background: #eaf3fc;
        color: var(--low);
      }
      .sev-Informational {
        background: #edf1f4;
        color: var(--info);
      }
      .neutral {
        background: #eef3f3;
        color: #61767b;
      }
      .good {
        background: var(--light);
        color: var(--teal);
      }
      .analysis-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 22px;
        align-items: start;
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .filters input:not([type="checkbox"]) {
        flex: 2;
        min-width: 150px !important;
      }
      .filters select {
        width: auto;
        flex: 1;
        min-width: 115px;
      }
      .filters label {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .risk-list {
        padding: 0 20px;
      }
      .risk-card {
        padding: 21px 0;
        border-bottom: 1px solid var(--line);
      }
      .risk-card:last-child {
        border: 0;
      }
      .risk-card-top {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .risk-card h3 {
        font-size: 14px;
        line-height: 1.55;
        margin: 8px 0 7px;
      }
      .risk-link {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        display: inline;
        font-weight: 650;
        line-height: inherit;
      }
      .risk-link:hover {
        background: transparent;
        color: var(--teal);
        text-decoration: underline;
      }
      .risk-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 13px;
      }
      .risk-meta {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 10px;
        color: var(--muted);
      }
      .risk-id {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .risk-trigger {
        font-size: 11px;
        background: #f4f7f7;
        padding: 9px 11px;
        border-radius: 5px;
        margin: 12px 0;
        color: #547076;
      }
      .family-overview {
        padding: 19px;
      }
      .family-overview h3 {
        font-size: 13px;
        margin-bottom: 7px;
      }
      .family-overview > p {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .family-button {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        padding: 10px 0;
        border-radius: 0;
        text-align: left;
        font-weight: 500;
      }
      .family-button:hover,
      .family-button.active {
        background: #f2f7f5;
      }
      .family-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
      }
      .family-bar {
        height: 4px;
        margin-top: 7px;
        border-radius: 3px;
        background: #eff2f1;
        overflow: hidden;
        display: flex;
      }
      .family-bar span {
        height: 100%;
      }
      .empty {
        padding: 45px 25px;
        text-align: center;
      }
      .empty-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--light);
        color: var(--teal);
        border-radius: 14px;
        margin: 0 auto 18px;
      }
      .empty-icon svg {
        width: 26px;
        height: 26px;
      }
      .empty h3 {
        font-size: 17px;
      }
      .empty p {
        color: var(--muted);
        max-width: 420px;
        margin: 0 auto 20px;
        font-size: 13px;
      }
      .empty .actions {
        justify-content: center;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .list-count {
        font-size: 11px;
        color: var(--muted);
        padding: 13px 20px;
        border-bottom: 1px solid var(--line);
      }
      .action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 20px;
      }
      .action-card {
        padding: 19px;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }
      .action-card h3 {
        font-size: 13px;
        line-height: 1.6;
        margin: 13px 0 8px;
      }
      .action-card p {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 16px;
      }
      .action-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .action-fields .field-label {
        font-size: 10px;
        margin-bottom: 6px;
      }
      .action-fields input,
      .action-fields select {
        font-size: 11px;
        padding: 8px !important;
      }
      .action-fields textarea {
        font-size: 11px;
        min-height: 55px;
        padding: 8px;
      }
      .action-card footer {
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .overdue {
        color: var(--critical) !important;
      }
      .library-list {
        padding: 0 22px;
      }
      .library-list details {
        border-bottom: 1px solid var(--line);
        padding: 18px 0;
      }
      .library-list details:last-child {
        border: 0;
      }
      .library-list summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .library-list summary::-webkit-details-marker {
        display: none;
      }
      .library-list summary strong {
        font-size: 13px;
        flex: 1;
        line-height: 1.5;
      }
      .library-detail {
        padding: 17px 0 0 30px;
        font-size: 12px;
        color: var(--muted);
      }
      .library-detail ul {
        padding-left: 18px;
        line-height: 1.9;
      }
      .library-detail .condition {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        padding: 10px;
        background: #f3f6f5;
        line-height: 1.8;
        white-space: normal;
      }
      .tags {

        .dialog-body {

        }
        .intro-banner {

        }
        .action-grid {

      @page {

      @media print {

        }

          margin-bottom: 7px;

        #print-root p,

          font-size: 9pt;

        }

          border-radius: 6px;

          font-size: 9pt;

        #print-root table {

        #print-root .report-note {

        }
        #print-root pre {
          white-space: pre-wrap;
          font: inherit;
        }
      }

    <div class="shell">

    <script>
      "use strict";
      /* 2. Shared vocabulary, questionnaire and catalogue data. */
      const APP_VERSION = 1,
        STORAGE_KEY = "isp-assistant.assessment.v1";
      const SEVERITIES = ["Critical", "High", "Medium", "Low", "Informational"];
      const RISK_STATUSES = [
        "Applicable",
        "Not Applicable",
        "To Be Confirmed",
        "Accepted",
        "Mitigated",
      ];
      const ACTION_STATUSES = [
        "To Assess",
        "To Do",
        "In Progress",
        "Implemented",
        "Not Retained",
        "Risk Accepted",
      ];
      const COMPONENTS = [
        "Web application",
        "Desktop application",
        "Mobile application",
        "API",
        "Server",
        "Virtual machine",
        "Container",
        "Kubernetes",
        "Database",
        "File storage",
        "SaaS service",
        "Cloud IaaS / PaaS",
        "Active Directory",
        "Entra ID / identity provider",
        "Reverse proxy",
        "Load balancer",
        "Firewall",
        "Network device",
        "Backup solution",
        "Monitoring solution",
        "Other",
      ];
      const USER_TYPES = [
        "Internal users",
        "Administrators",
        "Contractors",
        "Partners",
        "Customers",
        "External users",
        "Technical accounts",
        "Service accounts",
        "Application accounts",
        "Machine-to-Machine identities",
      ];
      const bool = (key, label, show) => ({ key, label, type: "bool", show });
      const text = (key, label, placeholder = "", show) => ({
        key,
        label,
        type: "text",
        placeholder,
        show,
      });
      const select = (key, label, options, show) => ({
        key,
        label,
        type: "select",
        options,
        show,
      });
      const multi = (key, label, options, show) => ({
        key,
        label,
        type: "multi",
        options,
        show,
        wide: true,
      });
      const yes = (key) => (s) => s.answers[key] === "yes";
      const either =
        (...keys) =>
        (s) =>
          keys.some((k) => s.answers[k] === "yes");
      const hasComponent =
        (...values) =>
        (s) =>
          values.some((v) => s.answers.components?.includes(v));
      const machineContext = (s) =>
        s.answers.serviceAccounts === "yes" ||
        s.answers.m2m === "yes" ||
        s.answers.userTypes?.some((v) =>
          [
            "Service accounts",
            "Technical accounts",
            "Application accounts",
            "Machine-to-Machine identities",
          ].includes(v),
        );
      const secretContext = (s) =>
        machineContext(s) ||
        s.answers.secrets === "yes" ||
        [
          "applicationPasswords",
          "apiKeys",
          "tokens",
          "certificates",
          "privateKeys",
          "serviceCredentials",
        ].some((k) => s.answers[k] === "yes");
      const aiContext = yes("ai");
      const sections = [
        {
          id: "general",
          title: "General information",
          description:
            "Define the project and its business context. You can return to any section as the assessment evolves.",
          fields: [
            text("name", "Project name", "e.g. People Hub — HR platform"),
            {
              key: "description",
              label: "Project description",
              type: "textarea",
              wide: true,
              placeholder: "What does the solution do, and how does it work?",

            {
              key: "objective",
              label: "Business objective",
              type: "textarea",
              wide: true,
              placeholder:
                "Business outcome, intended users and key dependencies",
            },
            text("owner", "Project owner / team", "Name or team"),
            select("environment", "Environment", [
              "On-premises",
              "Cloud",
              "SaaS",
              "Hybrid",
            ]),
            select("projectType", "Project type", [
              "New project",
              "Evolution of an existing system",
            ]),
            select("criticality", "Business criticality", [
              "Low",
              "Medium",
              "High",
              "Critical",
            ]),
          ],
        },
        {
          id: "architecture",
          title: "Architecture & components",
          description:
            "Select the building blocks in scope. Components activate relevant security review areas.",
          fields: [
            multi("components", "Project components", COMPONENTS),
            text(
              "architectureNotes",
              "Architecture notes",
              "Trust boundaries, integrations and deployment model",
            ),
          ],
        },
        {
          id: "network",
          title: "Network flows",
          description:
            "Map communications and trust boundaries. Add specific flows to capture authentication and encryption evidence.",
          fields: [
            bool("network", "Network communications"),
            bool("internalComms", "Internal communications", yes("network")),
            bool("internetComms", "Internet communications", yes("network")),
            bool("inbound", "Inbound Internet flows", yes("network")),
            bool("outbound", "Outbound Internet flows", yes("network")),
            bool("partnerComms", "Partner communications", yes("network")),
            bool("saasComms", "SaaS communications", yes("network")),
            bool(
              "appComms",
              "Application-to-application communications",
              yes("network"),
            ),
            bool("apiFlows", "API communications", yes("network")),
            bool("m2m", "Machine-to-Machine communications", yes("network")),
            text(
              "protocols",
              "Protocols used",
              "HTTPS, SFTP, AMQP…",
              yes("network"),
            ),
            bool("publicExposure", "Public exposure", yes("network")),
            bool("dmz", "DMZ / isolated ingress zone", yes("network")),
            bool("crossZone", "Cross-zone flows", yes("network")),
            bool("segmentation", "Network segmentation", yes("network")),
            bool(
              "restrictFlows",
              "Flows limited to necessary sources and ports",
              yes("network"),
            ),
            bool("egressControl", "Outbound traffic filtering", yes("network")),
          ],
        },
        {
          id: "data",
          title: "Data & classification",
          description:
            "Describe data sensitivity, hosting and lifecycle. An unanswered control stays unknown; it is never treated as a confirmed absence.",
          fields: [
            bool("data", "Processes or stores data"),
            multi(
              "dataClasses",
              "Data classification",
              [
                "Personal",
                "Sensitive",
                "Financial",
                "Secrets",
                "Credentials",
                "Business-critical",
                "Regulated",
                "Public",
              ],
              yes("data"),
            ),
            bool(
              "externalHosting",
              "Hosted outside the organization",
              yes("data"),
            ),
            bool("outsideEU", "Hosted outside the EU", yes("data")),
            bool("encryptedRest", "Encrypted at rest", yes("data")),
            bool("encryptedTransit", "Encrypted in transit", yes("data")),
            bool("backupRequired", "Backup required", yes("data")),
            bool("retentionRequired", "Retention requirements", yes("data")),
            bool(
              "deletionRequired",
              "Automatic deletion required",
              yes("data"),
            ),
            bool(
              "deletion",
              "Automatic deletion implemented",
              (s) =>
                s.answers.data === "yes" &&
                s.answers.deletionRequired === "yes",
            ),
            text(
              "dataLocation",
              "Hosting location",
              "Region / country / platform",
              yes("data"),
            ),
            text(
              "dataVolume",
              "Estimated volume",
              "e.g. 50,000 employee records",
              yes("data"),
            ),
            text(
              "retention",
              "Retention duration",
              "e.g. 5 years after employment",
              yes("data"),
            ),
            select(
              "confidentiality",
              "Confidentiality criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "integrity",
              "Integrity criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "availability",
              "Availability criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "traceability",
              "Traceability criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),

          ],
        },
        {
          id: "identity",
          title: "Users & identities",
          description:

          fields: [
            multi("userTypes", "User and identity populations", USER_TYPES),
            select("auth", "Authentication method", [
              "Entra ID / federated SSO",
              "Password",
              "Certificate / mTLS",
              "API Key",
              "OAuth 2.0 / OIDC",
              "None",
              "Other",
            ]),
            bool("mfa", "Multi-factor authentication"),
            bool("sso", "Single sign-on"),
            bool("federation", "Identity federation"),
            bool("localAccounts", "Local accounts"),
            bool("sharedAccounts", "Shared accounts"),
            bool("privileged", "Privileged accounts"),
            bool("leastPrivilege", "Least-privilege access enforced"),
            bool("lifecycle", "Automated joiner / mover / leaver lifecycle"),
            bool("serviceAccounts", "Service / technical accounts"),
            text(
              "serviceCount",
              "Number of machine accounts",
              "e.g. 3",
              machineContext,

            text(
              "serviceUse",
              "Machine identity use cases",
              "Integrations, batch jobs…",
              machineContext,
            ),
            bool("staticSecrets", "Static machine credentials", machineContext),
            bool(
              "sharedService",
              "Machine account shared across applications",
              machineContext,
            ),
            bool(
              "machineLeastPrivilege",
              "Machine identities use least privilege",

            ),
            bool(

              "Machine identity activity is attributable and logged",

            ),
            bool("apiKeys", "API keys"),
            bool("certificates", "Certificates"),
            bool(
              "sessionControls",
              "Secure session expiry and cookie controls",
              hasComponent("Web application"),
            ),
            bool(
              "appAuthorization",
              "Server-side authorization verified",

      /* 8. Event handling. Inputs update state without losing editing focus. */
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (
          el.dataset.answer &&
          ["text", "textarea"].includes(fieldIndex[el.dataset.answer]?.type)
        ) {
          state.answers[el.dataset.answer] = el.value;
          changed(false);
        }
        if (
          el.dataset.filter &&
          el.type !== "checkbox" &&
          el.tagName !== "SELECT"
        ) {
          ui[el.dataset.filter] = el.value;
          resetFilterPage(el.dataset.filter);
          refreshResults();
        }
        if (el.dataset.decision === "comments") {
          state.decisions[el.dataset.riskId] = {
            ...(state.decisions[el.dataset.riskId] || {}),
            comments: el.value,
          };
          changed(false);
        }
        if (
          el.dataset.actionField &&
          ["owner", "due", "comment"].includes(el.dataset.actionField)
        ) {
          setAction(el.dataset.actionKey, el.dataset.actionField, el.value);
        }
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (el.dataset.answer) {
          const key = el.dataset.answer,
            f = fieldIndex[key];
          if (f.type === "multi") {
            const values = new Set(state.answers[key] || []);
            el.checked ? values.add(el.value) : values.delete(el.value);
            state.answers[key] = [...values];
          } else state.answers[key] = el.value;
          changed(!["text", "textarea"].includes(f.type));
        }
        if (
          el.dataset.filter &&
          (el.type === "checkbox" || el.tagName === "SELECT")
        ) {
          ui[el.dataset.filter] =
            el.type === "checkbox" ? el.checked : el.value;
          resetFilterPage(el.dataset.filter);
          refreshResults();
        }
        if (el.dataset.decision && el.dataset.decision !== "comments") {
          setDecision(el.dataset.riskId, el.dataset.decision, el.value);
        }
        if (el.dataset.actionField) {
          setAction(
            el.dataset.actionKey,
            el.dataset.actionField,
            el.type === "checkbox" ? el.checked : el.value,
          );
          if (ui.view === "actions" && el.tagName === "SELECT") {
            render();
          }
        }
      });
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        if (b.dataset.view) {
          ui.view = b.dataset.view;
          render();
          window.scrollTo(0, 0);
        }
        if (b.dataset.section) {
          ui.section = b.dataset.section;
          render();
          window.scrollTo(0, 0);
        }
        if (own(b.dataset, "family")) {
          ui.riskFamily = b.dataset.family;
          ui.riskPage = 1;
          render();
        }
        if (b.dataset.listPage) {
          ui[b.dataset.listPage + "Page"] = Number(b.dataset.page);
          refreshResults();
          $("#main").scrollIntoView({ behavior: "instant" });
        }
        if (b.dataset.risk) openRisk(b.dataset.risk);
        if (b.hasAttribute("data-close")) closeDialog();
        if (b.dataset.addRecord) openRecord(b.dataset.addRecord);
        if (b.dataset.editRecord)
          openRecord(b.dataset.editRecord, Number(b.dataset.index));
        if (b.dataset.deleteRecord) {
          const collection = collectionFor[b.dataset.deleteRecord];
          state[collection].splice(Number(b.dataset.index), 1);
          closeDialog();
          changed(true);
          toast("Record deleted.");
        }
        if (b.dataset.suppress) {
          setDecision(b.dataset.suppress, "hidden", b.dataset.value === "true");
          closeDialog();
          toast(
            b.dataset.value === "true"
              ? "Risk suppressed. Use Show suppressed to restore it."
              : "Risk restored.",
          );
        }
        if (b.dataset.removeAction) {
          setAction(b.dataset.removeAction, "selected", false);
          render();
          toast(
            "Recommendation removed from the plan. Its details are preserved.",
          );
        }
        if (b.dataset.useTemplate) {
          const t = state.customCatalog.find(
            (t) => t.id === b.dataset.useTemplate,
          );
          if (t) {
            if (!state.manualRisks.some((r) => r.id === t.id))
              state.manualRisks.push({ ...t });
            changed(true);
            toast("Custom risk added to the assessment.");
          }
        }
        if (b.dataset.confirm) {
          const cmd = b.dataset.confirm;
          closeDialog();
          if (cmd === "demo") loadDemo();
          if (cmd === "reset") {
            state = blankState();
            ui.view = "qualification";
            ui.section = "general";
            clearFilters();
            changed(true);
            toast("New assessment started.");
          }
          if (cmd === "import" && pendingImport) {
            state = pendingImport;
            pendingImport = null;
            clearFilters();
            ui.view = "qualification";
            ui.section = "general";
            changed(true);
            toast("Project imported and saved locally.");
          }
        }
        const command = b.dataset.command;
        if (command === "demo")
          confirmAction(
            "Load the demo project?",
            "This replaces the current assessment with a realistic HR platform scenario. Export your work first if you need a backup.",
            "demo",
            "Load Demo",
          );
        if (command === "manual-risk") openManualRisk();
        if (command === "custom-template") openManualRisk(true);
        if (command === "component") openComponent();
        if (command === "analyze") {
          ui.view = "risks";
          render();
          window.scrollTo(0, 0);
        }
        if (command === "qualify") {
          ui.view = "qualification";
          render();
        }
        if (command === "action-plan") {
          ui.view = "actions";
          render();
        }
        if (command === "print") printReport();
        if (command === "clear-risk-filters") {
          Object.assign(ui, {
            riskPage: 1,
            riskSearch: "",
            riskFamily: "",
            riskSeverity: "",
            riskStatus: "",
            showHidden: false,
          });
          render();
        }
        if (command === "clear-action-filters") {
          Object.assign(ui, {
            actionSearch: "",
            actionFamily: "",
            actionSeverity: "",
            actionStatus: "",
            actionOwner: "",
          });
          render();
        }
      });
      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (!["record-form", "manual-form", "component-form"].includes(form.id))
          return;
        event.preventDefault();
        const data = new FormData(form);
        if (form.id === "record-form") {
          const type = form.dataset.type,
            collection = collectionFor[type],
            record = Object.fromEntries(
              recordFields[type].map(([key]) => [
                key,
                safeText(data.get(key), 3000).trim(),
              ]),
            );
          if (own(form.dataset, "index"))
            state[collection][Number(form.dataset.index)] = record;
          else state[collection].push(record);
          if (type === "flow") state.answers.network = "yes";
          if (type === "thirdParty") state.answers.thirdParty = "yes";
          if (type === "dataType") state.answers.data = "yes";
        }
        if (form.id === "component-form") {
          const name = data.get("name").trim();
          if (!name) return;
          if (![...COMPONENTS, ...state.componentsCustom].includes(name))
            state.componentsCustom.push(name);
          state.answers.components = [
            ...new Set([...(state.answers.components || []), name]),
          ];
        }
        if (form.id === "manual-form") {
          const recommendations = data
            .get("recommendations")
            .split("\n")
            .map((s) => s.trim())
            .filter(Boolean)
            .slice(0, 30);
          if (!recommendations.length) {
            toast("Enter at least one recommendation.");
            return;
          }
          const risk = {
            id: uuid(),
            title: data.get("title").trim(),
            severity: data.get("severity"),
            family: data.get("customFamily").trim() || data.get("family"),
            description: data.get("description").trim(),
            justification: data.get("justification").trim(),
            recommendations,
            tags: ["Custom"],
          };
          if (!risk.title || !risk.description || !risk.justification) {
            toast("Please complete the required risk details.");
            return;
          }
          if (form.dataset.library === "true") state.customCatalog.push(risk);
          else state.manualRisks.push(risk);
        }
        closeDialog();
        changed(true);
        toast("Saved to the assessment.");
      });
      function clearFilters() {
        Object.assign(ui, {
          riskPage: 1,
          libraryPage: 1,
          riskSearch: "",
          riskFamily: "",
          riskSeverity: "",
          riskStatus: "",
          showHidden: false,
          actionSearch: "",
          actionFamily: "",
          actionSeverity: "",
          actionStatus: "",
          actionOwner: "",
          librarySearch: "",
          libraryFamily: "",
        });
      }
      $("#save-btn").addEventListener("click", () => saveLocal(true));
      $("#load-btn").addEventListener("click", () => $("#import-file").click());
      $("#import-file").addEventListener("change", (e) => {
        importProject(e.target.files[0]);
        e.target.value = "";
      });
      $("#reset-btn").addEventListener("click", () =>
        confirmAction(
          "Start a new assessment?",
          "This clears the current assessment in this browser. Export a JSON backup first to preserve your work.",
          "reset",
          "Reset Assessment",
        ),
      );
      $("#export-btn").addEventListener("click", () => {
        const menu = $("#export-menu");
        menu.hidden = !menu.hidden;
        $("#export-btn").setAttribute("aria-expanded", String(!menu.hidden));
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".export-wrap")) {
          $("#export-menu").hidden = true;
          $("#export-btn").setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          $("#export-menu").hidden = true;
          $("#export-btn").setAttribute("aria-expanded", "false");
        }
      });
      $("#json-btn").addEventListener("click", () => {
        exportProject();
        $("#export-menu").hidden = true;
        $("#export-btn").setAttribute("aria-expanded", "false");
      });
      $("#report-btn").addEventListener("click", () => {
        $("#export-menu").hidden = true;
        $("#export-btn").setAttribute("aria-expanded", "false");
        printReport();
      });
      $("#dialog").addEventListener("click", (e) => {
        if (e.target === $("#dialog")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeDialog();
        }
      });
      window.addEventListener("beforeprint", buildReport);
      window.addEventListener("pagehide", () => {
        if (saveTimer) saveLocal(false);
      });
      restoreLocal();
      populateIcons();
      render();
    </script>
  </body>
</html>
