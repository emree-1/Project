<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ISP Assistant · Security assessment workspace</title>
    <style>
      /* Presentation — all resources are embedded; no network access is used. */
      :root {
        --nav: #132b32;
        --nav-muted: #9eb4b8;
        --bg: #f4f6f6;
        --paper: #fff;
        --ink: #19343b;
        --muted: #65787d;
        --line: #dce5e5;
        --teal: #12786e;
        --light: #e8f4f0;
        --critical: #ae293e;
        --high: #b45e18;
        --medium: #946b08;
        --low: #226895;
        --info: #64737e;
        --shadow: 0 5px 20px #17353c06;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      a,
      input,
      select,
      textarea,
      summary {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #4ca89c;
      }
      button {
        color: inherit;
      }
      button.primary {
        background: var(--teal);
        color: white;
        border-color: var(--teal);
      }
      button.primary:hover {
        background: #0c625a;
      }
      button.danger {
        color: var(--critical);
      }
      button,
      .button {
        border: 1px solid var(--line);
        background: white;
        border-radius: 7px;
        padding: 9px 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        line-height: 1.25;
      }
      button:hover {
        background: #f1f6f5;
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
      }
      button.small {
        font-size: 12px;
        padding: 6px 9px;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.9px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      h3 {
        font-size: 15px;
      }
      p {
        line-height: 1.65;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.6px;
        font-size: 10px;
        font-weight: 750;
        color: var(--teal);
        margin-bottom: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--nav);
        color: white;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        letter-spacing: -0.4px;
        font-weight: 750;
        margin: 0 10px 34px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 38px;
        border-radius: 10px;
        background: #1c514f;
        color: #95dcc3;
      }
      .brand-mark svg {
        width: 24px;
        height: 24px;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 2px;
        display: block;
        font-weight: 500;
        color: var(--nav-muted);
        margin-top: 3px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.7px;
        color: var(--nav-muted);
        margin: 0 12px 10px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        background: transparent;
        border: 0;
        justify-content: flex-start;
        color: #b7c9cc;
        padding: 12px;
        border-radius: 7px;
        text-align: left;
        font-weight: 500;
      }
      .nav button.active {
        background: #24434a;
        color: white;
        box-shadow: inset 3px 0 #6dc3a7;
      }
      .nav button:hover {
        background: #203e45;
      }
      .nav button svg {
        margin-right: 4px;
      }
      .nav .count {
        margin-left: auto;
        font-size: 11px;
        background: #ffffff15;
        color: #dcece8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 32px 10px 0;
        color: #b7c9cc;
        font-size: 12px;
      }
      .local-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: #75c2a4;
      }
      .sidebar-bottom p {
        font-size: 11px;
        color: #90a9ae;
        margin: 0;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        min-height: 82px;
        background: #ffffffed;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 34px;
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(12px);
      }
      .project-caption {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .project-title {
        font-size: 14px;
        font-weight: 700;
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-progress {
        width: 130px;
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .progress-track {
        height: 4px;
        background: #e6eeed;
        border-radius: 4px;
        margin-top: 7px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        background: var(--teal);
        height: 100%;
        transition: width 0.2s;
      }
      .top-tools {
        display: flex;
        gap: 7px;
      }
      .top-tools button {
        font-size: 12px;
      }
      .export-wrap {
        position: relative;
      }
      .export-menu {
        position: absolute;
        right: 0;
        top: 44px;
        min-width: 205px;
        background: white;
        padding: 6px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px #14363c20;
        border-radius: 8px;
      }
      .export-menu button {
        display: flex;
        width: 100%;
        justify-content: flex-start;
        border: 0;
        padding: 11px;
      }
      .content {
        max-width: 1460px;
        margin: auto;
        padding: 34px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 27px;
      }
      .page-heading p {
        margin-bottom: 0;
        color: var(--muted);
        max-width: 700px;
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
        box-shadow: var(--shadow);
      }
      .panel-head {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head h2 {
        margin-bottom: 5px;
      }
      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .panel-body {
        padding: 24px;
      }
      .qualification-layout {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .section-nav {
        padding: 10px;
        position: sticky;
        top: 108px;
      }
      .section-nav button {
        width: 100%;
        border: 0;
        text-align: left;
        justify-content: flex-start;
        font-size: 12px;
        font-weight: 500;
        padding: 11px 10px;
        background: transparent;
        gap: 10px;
        margin: 1px 0;
      }
      .section-nav button.active {
        background: var(--light);
        color: #086a60;
        font-weight: 700;
      }
      .section-nav .section-number {
        font-size: 10px;
        min-width: 20px;
        color: var(--muted);
      }
      .section-nav .check {
        margin-left: auto;
        color: var(--teal);
        font-size: 12px;
      }
      .section-description {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 25px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .field {
        display: block;
        min-width: 0;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field-label {
        font-size: 12px;
        font-weight: 650;
        display: block;
        margin-bottom: 9px;
      }
      .field-help {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: block;
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        width: 100%;
        border: 1px solid #cddbdc;
        border-radius: 6px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        min-width: 0;
      }
      input::placeholder,
      textarea::placeholder {
        color: #93a0a3;
      }
      textarea {
        resize: vertical;
        min-height: 86px;
        line-height: 1.6;
      }
      input[type="checkbox"] {
        accent-color: var(--teal);
        width: 16px;
        height: 16px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 6px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }
      .chip:has(input:checked) {
        border-color: #5ca89a;
        background: var(--light);
        color: #09675d;
      }
      .chip input {
        margin: 0;
      }
      .segmented {
        display: flex;
        gap: 0;
        width: max-content;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented label {
        position: relative;
        cursor: pointer;
        font-size: 11px;
        display: block;
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .segmented span {
        display: block;
        padding: 9px 12px;
        border-right: 1px solid var(--line);
        background: white;
      }
      .segmented label:last-child span {
        border: 0;
      }
      .segmented input:checked + span {
        background: var(--light);
        color: #09675d;
        font-weight: 700;
      }
      .segmented input:focus-visible + span {
        outline: 3px solid var(--teal);
        outline-offset: -3px;
      }
      .form-divider {
        grid-column: 1/-1;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        margin-top: 8px;
        font-weight: 650;
        font-size: 13px;
      }
      .callout {
        padding: 14px 17px;
        border-radius: 7px;
        background: #eef5f5;
        color: #47656a;
        font-size: 12px;
        line-height: 1.7;
        display: flex;
        gap: 10px;
      }
      .callout.warm {
        background: #fbf5e9;
        color: #8c662a;
      }
      .section-footer {
        border-top: 1px solid var(--line);
        padding: 17px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-footer small {
        font-size: 11px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin: 28px 0 14px;
      }
      .list-header h3 {
        margin: 0;
      }
      .entity-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 15px 17px;
        margin: 9px 0;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .entity-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--light);
        border-radius: 7px;
        color: var(--teal);
        flex-shrink: 0;
      }
      .entity-content {
        flex: 1;
        min-width: 0;
      }
      .entity-content strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }
      .entity-content small {
        font-size: 11px;
        line-height: 1.6;
        display: block;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.25fr repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 20px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .stat.total {
        background: var(--nav);
        color: white;
        border-color: var(--nav);
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat.total .stat-label {
        color: #bbced0;
      }
      .stat-value {
        font-size: 31px;
        font-weight: 650;
        letter-spacing: -1px;
        margin: 12px 0 3px;
      }
      .stat-sub {
        font-size: 10px;
        color: var(--muted);
      }
      .stat.total .stat-sub {
        color: #9ab5b8;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.1px;
        font-weight: 700;
        padding: 4px 8px;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sev-Critical {
        background: #fbeaed;
        color: var(--critical);
      }
      .sev-High {
        background: #fff0e4;
        color: var(--high);
      }
      .sev-Medium {
        background: #fbf4d9;
        color: var(--medium);
      }
      .sev-Low {
        background: #eaf3fc;
        color: var(--low);
      }
      .sev-Informational {
        background: #edf1f4;
        color: var(--info);
      }
      .neutral {
        background: #eef3f3;
        color: #61767b;
      }
      .good {
        background: var(--light);
        color: var(--teal);
      }
      .analysis-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 22px;
        align-items: start;
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .filters input:not([type="checkbox"]) {
        flex: 2;
        min-width: 150px !important;
      }
      .filters select {
        width: auto;
        flex: 1;
        min-width: 115px;
      }
      .filters label {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .risk-list {
        padding: 0 20px;
      }
      .risk-card {
        padding: 21px 0;
        border-bottom: 1px solid var(--line);
      }
      .risk-card:last-child {
        border: 0;
      }
      .risk-card-top {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .risk-card h3 {
        font-size: 14px;
        line-height: 1.55;
        margin: 8px 0 7px;
      }
      .risk-link {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        display: inline;
        font-weight: 650;
        line-height: inherit;
      }
      .risk-link:hover {
        background: transparent;
        color: var(--teal);
        text-decoration: underline;
      }
      .risk-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 13px;
      }
      .risk-meta {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 10px;
        color: var(--muted);
      }
      .risk-id {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .risk-trigger {
        font-size: 11px;
        background: #f4f7f7;
        padding: 9px 11px;
        border-radius: 5px;
        margin: 12px 0;
        color: #547076;
      }
      .family-overview {
        padding: 19px;
      }
      .family-overview h3 {
        font-size: 13px;
        margin-bottom: 7px;
      }
      .family-overview > p {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .family-button {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        padding: 10px 0;
        border-radius: 0;
        text-align: left;
        font-weight: 500;
      }
      .family-button:hover,
      .family-button.active {
        background: #f2f7f5;
      }
      .family-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
      }
      .family-bar {
        height: 4px;
        margin-top: 7px;
        border-radius: 3px;
        background: #eff2f1;
        overflow: hidden;
        display: flex;
      }
      .family-bar span {
        height: 100%;
      }
      .empty {
        padding: 45px 25px;
        text-align: center;
      }
      .empty-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--light);
        color: var(--teal);
        border-radius: 14px;
        margin: 0 auto 18px;
      }
      .empty-icon svg {
        width: 26px;
        height: 26px;
      }
      .empty h3 {
        font-size: 17px;
      }
      .empty p {
        color: var(--muted);
        max-width: 420px;
        margin: 0 auto 20px;
        font-size: 13px;
      }
      .empty .actions {
        justify-content: center;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .list-count {
        font-size: 11px;
        color: var(--muted);
        padding: 13px 20px;
        border-bottom: 1px solid var(--line);
      }
      .action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 20px;
      }
      .action-card {
        padding: 19px;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }
      .action-card h3 {
        font-size: 13px;
        line-height: 1.6;
        margin: 13px 0 8px;
      }
      .action-card p {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 16px;
      }
      .action-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .action-fields .field-label {
        font-size: 10px;
        margin-bottom: 6px;
      }
      .action-fields input,
      .action-fields select {
        font-size: 11px;
        padding: 8px !important;
      }
      .action-fields textarea {
        font-size: 11px;
        min-height: 55px;
        padding: 8px;
      }
      .action-card footer {
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .overdue {
        color: var(--critical) !important;
      }
      .library-list {
        padding: 0 22px;
      }
      .library-list details {
        border-bottom: 1px solid var(--line);
        padding: 18px 0;
      }
      .library-list details:last-child {
        border: 0;
      }
      .library-list summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .library-list summary::-webkit-details-marker {
        display: none;
      }
      .library-list summary strong {
        font-size: 13px;
        flex: 1;
        line-height: 1.5;
      }
      .library-detail {
        padding: 17px 0 0 30px;
        font-size: 12px;
        color: var(--muted);
      }
      .library-detail ul {
        padding-left: 18px;
        line-height: 1.9;
      }
      .library-detail .condition {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        padding: 10px;
        background: #f3f6f5;
        line-height: 1.8;
        white-space: normal;
      }
      .tags {

        line-height: 1.7;
        color: var(--muted);
        padding: 0 24px 18px;
      }
      .report-added {
        border-top: 1px solid var(--line);
        margin-top: 20px;
      }
      @media (max-width: 1250px) {
        .phase-timeline {
          grid-template-columns: repeat(3, 1fr);
          gap: 18px 0;
        }
        .phase:nth-child(3) {
          border: 0;
        }
        .map-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .map-side {
          position: static;
        }
        .map-side ul {
          columns: 2;
        }
      }
      @media (max-width: 850px) {
        .cockpit-grid {
          grid-template-columns: 1fr;
        }
        .cockpit-grid .span-all {
          grid-column: auto;
        }
        .blocker-table {
          grid-template-columns: 1fr;
        }
        .reco-grid {
          grid-template-columns: 1fr;
        }
        .next-columns {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .phase-timeline {
          grid-template-columns: repeat(3, 1fr);
        }
        .map-side ul {
          columns: 1;
        }
      }
      @media (max-width: 520px) {
        .phase-timeline {
          grid-template-columns: repeat(2, 1fr);
        }
        .phase:nth-child(3) {
          border-right: 1px solid var(--line);
        }
        .phase:nth-child(even) {
          border: 0;
        }
        .cockpit-card {
          padding: 18px;
        }
        .comment-tools {
          margin: 6px 0 0;
          width: 100%;
        }
        .status-grid {
          gap: 7px;
        }
        .status-grid div {
          padding: 10px;
        }
        .map-viewport {
          min-height: 420px;
          max-height: 600px;
        }
        .cockpit-top {
          flex-wrap: wrap;
        }
        .mapped-row {
          flex-wrap: wrap;
        }
      }
    </style>

    <script>
      "use strict";
      /* Shared vocabulary, questionnaire and catalogue data. */
      const APP_VERSION = 2,
        STORAGE_KEY = "isp-assistant.assessment.v1";
      const SEVERITIES = ["Critical", "High", "Medium", "Low", "Informational"];
      const RISK_STATUSES = [

      const ACTION_STATUSES = [

      const COMPONENTS = [
        "Web application",

        "API",
        "Server",
        "Virtual machine",
        "Container",
        "Kubernetes",
        "Database",
        "File storage",
        "SaaS service",
        "Cloud IaaS / PaaS",
        "Active Directory",
        "Entra ID / identity provider",

        "Load balancer",
        "Firewall",

        "Backup solution",

      const USER_TYPES = [
        "Internal users",

        "Contractors",
        "Partners",
        "Customers",
        "External users",
        "Technical accounts",
        "Service accounts",
        "Application accounts",
        "Machine-to-Machine identities",
      ];
      const bool = (key, label, show) => ({ key, label, type: "bool", show });
      const text = (key, label, placeholder = "", show) => ({
        key,
        label,
        type: "text",
        placeholder,
        show,
      });
      const select = (key, label, options, show) => ({
        key,
        label,
        type: "select",
        options,
        show,
      });
      const multi = (key, label, options, show) => ({
        key,
        label,
        type: "multi",
        options,
        show,
        wide: true,
      });
      const yes = (key) => (s) => s.answers[key] === "yes";
      const either =
        (...keys) =>
        (s) =>
          keys.some((k) => s.answers[k] === "yes");
      const hasComponent =
        (...values) =>
        (s) =>
          values.some((v) => s.answers.components?.includes(v));
      const machineContext = (s) =>
        s.answers.serviceAccounts === "yes" ||
        s.answers.m2m === "yes" ||
        s.answers.userTypes?.some((v) =>
          [
            "Service accounts",
            "Technical accounts",
            "Application accounts",
            "Machine-to-Machine identities",
          ].includes(v),
        );
      const secretContext = (s) =>
        machineContext(s) ||
        s.answers.secrets === "yes" ||
        [
          "applicationPasswords",
          "apiKeys",
          "tokens",
          "certificates",
          "privateKeys",
          "serviceCredentials",
        ].some((k) => s.answers[k] === "yes");
      const aiContext = yes("ai");
      const sections = [
        {
          id: "general",
          title: "General information",
          description:
            "Define the project and its business context. You can return to any section as the assessment evolves.",
          fields: [
            text("name", "Project name", "e.g. People Hub — HR platform"),
            {
              key: "description",
              label: "Project description",
              type: "textarea",
              wide: true,
              placeholder: "What does the solution do, and how does it work?",
            },
            {
              key: "objective",
              label: "Business objective",
              type: "textarea",
              wide: true,
              placeholder:
                "Business outcome, intended users and key dependencies",
            },
            text("owner", "Project owner / team", "Name or team"),
            select("environment", "Environment", [
              "On-premises",
              "Cloud",
              "SaaS",
              "Hybrid",
            ]),
            select("projectType", "Project type", [
              "New project",
              "Evolution of an existing system",
            ]),
            select("criticality", "Business criticality", [
              "Low",
              "Medium",
              "High",
              "Critical",
            ]),
          ],
        },
        {
          id: "architecture",
          title: "Architecture & components",
          description:
            "Select the building blocks in scope. Components activate relevant security review areas.",
          fields: [
            multi("components", "Project components", COMPONENTS),
            text(
              "architectureNotes",
              "Architecture notes",
              "Trust boundaries, integrations and deployment model",
            ),
          ],
        },
        {
          id: "network",
          title: "Network flows",
          description:
            "Map communications and trust boundaries. Add specific flows to capture authentication and encryption evidence.",
          fields: [
            bool("network", "Network communications"),
            bool("internalComms", "Internal communications", yes("network")),
            bool("internetComms", "Internet communications", yes("network")),
            bool("inbound", "Inbound Internet flows", yes("network")),
            bool("outbound", "Outbound Internet flows", yes("network")),
            bool("partnerComms", "Partner communications", yes("network")),
            bool("saasComms", "SaaS communications", yes("network")),
            bool(
              "appComms",
              "Application-to-application communications",
              yes("network"),
            ),
            bool("apiFlows", "API communications", yes("network")),
            bool("m2m", "Machine-to-Machine communications", yes("network")),
            text(
              "protocols",
              "Protocols used",
              "HTTPS, SFTP, AMQP…",
              yes("network"),
            ),
            bool("publicExposure", "Public exposure", yes("network")),
            bool("dmz", "DMZ / isolated ingress zone", yes("network")),
            bool("crossZone", "Cross-zone flows", yes("network")),
            bool("segmentation", "Network segmentation", yes("network")),
            bool(
              "restrictFlows",
              "Flows limited to necessary sources and ports",
              yes("network"),
            ),
            bool("egressControl", "Outbound traffic filtering", yes("network")),
          ],
        },
        {
          id: "data",
          title: "Data & classification",
          description:
            "Describe data sensitivity, hosting and lifecycle. An unanswered control stays unknown; it is never treated as a confirmed absence.",
          fields: [
            bool("data", "Processes or stores data"),
            multi(
              "dataClasses",
              "Data classification",
              [
                "Personal",
                "Sensitive",
                "Financial",
                "Secrets",
                "Credentials",
                "Business-critical",
                "Regulated",
                "Public",
              ],
              yes("data"),
            ),
            bool(
              "externalHosting",
              "Hosted outside the organization",
              yes("data"),
            ),
            bool("outsideEU", "Hosted outside the EU", yes("data")),
            bool("encryptedRest", "Encrypted at rest", yes("data")),
            bool("encryptedTransit", "Encrypted in transit", yes("data")),
            bool("backupRequired", "Backup required", yes("data")),
            bool("retentionRequired", "Retention requirements", yes("data")),
            bool(
              "deletionRequired",
              "Automatic deletion required",
              yes("data"),
            ),
            bool(
              "deletion",
              "Automatic deletion implemented",
              (s) =>
                s.answers.data === "yes" &&
                s.answers.deletionRequired === "yes",
            ),
            text(
              "dataLocation",
              "Hosting location",
              "Region / country / platform",
              yes("data"),
            ),
            text(
              "dataVolume",
              "Estimated volume",
              "e.g. 50,000 employee records",
              yes("data"),
            ),
            text(
              "retention",
              "Retention duration",
              "e.g. 5 years after employment",
              yes("data"),
            ),
            select(
              "confidentiality",
              "Confidentiality criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "integrity",
              "Integrity criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "availability",
              "Availability criticality",
              ["Low", "Medium", "High", "Critical"],
              yes("data"),
            ),
            select(
              "traceability",
              "Traceability criticality",
              ["Low", "Medium", "High", "Critical"],

        },
        {
          id: "identity",
          title: "Users & identities",
          description:

          fields: [
            multi("userTypes", "User and identity populations", USER_TYPES),
            select("auth", "Authentication method", [
              "Entra ID / federated SSO",
              "Password",
              "Certificate / mTLS",
              "API Key",
              "OAuth 2.0 / OIDC",
              "None",
              "Other",

            bool("mfa", "Multi-factor authentication"),
            bool("sso", "Single sign-on"),
            bool("federation", "Identity federation"),
            bool("localAccounts", "Local accounts"),
            bool("sharedAccounts", "Shared accounts"),
            bool("privileged", "Privileged accounts"),
            bool("leastPrivilege", "Least-privilege access enforced"),
            bool("lifecycle", "Automated joiner / mover / leaver lifecycle"),
            bool("serviceAccounts", "Service / technical accounts"),
            text(
              "serviceCount",
              "Number of machine accounts",
              "e.g. 3",
              machineContext,
            ),
            text(
              "serviceUse",
              "Machine identity use cases",
              "Integrations, batch jobs…",
              machineContext,
            ),
            bool("staticSecrets", "Static machine credentials", machineContext),
            bool(
              "sharedService",
              "Machine account shared across applications",
              machineContext,
            ),
            bool(
              "machineLeastPrivilege",
              "Machine identities use least privilege",
              machineContext,

            bool(
              "machineLogging",
              "Machine identity activity is attributable and logged",
              machineContext,
            ),
            bool("apiKeys", "API keys"),
            bool("certificates", "Certificates"),
            bool(
              "sessionControls",
              "Secure session expiry and cookie controls",

            bool(
              "appAuthorization",
              "Server-side authorization verified",

        {

        {

            bool("vpn", "VPN access"),

          id: "secrets",

            bool("secrets", "Application uses secrets / credentials"),

        {
          id: "resilience",
          title: "Backup & resilience",
          description:
            "Capture recovery objectives and the mechanisms that protect continuity of service.",
          fields: [
            bool("backups", "Backups"),
            bool("dr", "Disaster recovery / business continuity plan"),
            bool("redundancy", "Redundancy"),
            bool("ha", "High availability"),
            bool(
              "criticalDependencies",
              "Critical external / single dependencies",
            ),
            text(
              "dependencies",
              "Critical dependency details",
              "Identity, network, supplier, database…",
            ),
            text("rpo", "Recovery point objective (RPO)", "e.g. 4 hours"),
            text("rto", "Recovery time objective (RTO)", "e.g. 8 hours"),
            bool(
              "recoveryAligned",
              "RPO / RTO validated against business needs",
            ),
            bool("immutable", "Immutable backups", yes("backups")),
            bool(
              "backupIsolated",

            bool("restoreTest", "Restore testing", yes("backups")),

        {
          id: "logging",
          title: "Logging & monitoring",
          description:
            "Determine whether security events can be attributed, investigated and detected in time.",
          fields: [
            bool("appLogs", "Application logs"),
            bool("authLogs", "Authentication logs"),
            bool("securityLogs", "Security logs"),
            bool("centralLogs", "Centralized logging"),
            bool("siem", "SIEM integration"),
            bool("alerts", "Security alerting"),
            text(
              "logRetention",
              "Log retention duration",
              "e.g. 90 days searchable, 1 year archived",
            ),
            bool(
              "retentionAdequate",
              "Log retention meets investigation requirements",
            ),
            bool("timeSync", "Synchronized time source"),
            bool(
              "vulnManagement",
              "Vulnerability scanning and remediation process",
            ),
          ],
        },
        {
          id: "ai",
          title: "Artificial intelligence",
          description:
            "Identify AI data flows, supplier reuse and the authority granted to AI agents.",
          fields: [
            bool("ai", "Use of an AI model"),
            bool("aiSaas", "SaaS AI service", aiContext),
            bool("aiLocal", "Locally hosted model", aiContext),
            bool("aiData", "Project data sent to the model", aiContext),
            bool("aiPersonal", "Personal data sent to the model", aiContext),
            bool(
              "aiConfidential",
              "Confidential data sent to the model",
              aiContext,
            ),
            bool(
              "aiTraining",
              "Supplier uses customer data for training",
              aiContext,
            ),
            bool("aiAgents", "AI agents", aiContext),
            bool("aiTools", "AI access to internal tools or data", aiContext),
            bool(
              "aiLeastPrivilege",
              "AI tool permissions restricted",
              aiContext,
            ),
            bool(
              "aiHumanReview",
              "Human approval for consequential AI actions",
              aiContext,
            ),
            bool(
              "aiInjection",
              "Prompt injection and tool-input protections",
              aiContext,
            ),
            text(
              "aiUse",
              "AI use cases and data boundaries",
              "Model, data sources, permitted actions…",
              aiContext,
            ),
          ],
        },
      ];
      const fieldIndex = Object.fromEntries(
        sections.flatMap((s) => s.fields.map((f) => [f.key, f])),
      );
      // Declarative conditions: all / any trees of explicit facts. Unknown never equals "no".
      const eq = (key, value) => ({ key, op: "eq", value });
      const contains = (key, value) => ({ key, op: "includes", value });
      const all = (...conditions) => ({ all: conditions });
      const any = (...conditions) => ({ any: conditions });
      const Y = (key) => eq(key, "yes"),
        N = (key) => eq(key, "no");
      const machine = any(
        Y("serviceAccounts"),
        Y("m2m"),
        contains("userTypes", "Service accounts"),
        contains("userTypes", "Technical accounts"),
        contains("userTypes", "Application accounts"),
        contains("userTypes", "Machine-to-Machine identities"),
      );
      const sensitive = all(
        Y("data"),
        any(
          ...[
            "Sensitive",
            "Personal",
            "Financial",
            "Secrets",
            "Credentials",
            "Regulated",
          ].map((v) => contains("dataClasses", v)),
        ),
      );
      const criticalBusiness = any(
        eq("criticality", "High"),
        eq("criticality", "Critical"),
      );
      const exposed = any(
        Y("webExposure"),
        Y("apiExposure"),
        Y("publicExposure"),
        Y("inbound"),
      );
      const third = any(
        Y("thirdParty"),
        { collection: "thirdParties" },
        Y("supplierAdmin"),
      );
      const cloud = any(
        eq("environment", "Cloud"),
        eq("environment", "Hybrid"),
        eq("environment", "SaaS"),
        contains("components", "SaaS service"),
        contains("components", "Cloud IaaS / PaaS"),
      );
      const secretUse = any(
        Y("secrets"),
        machine,
        Y("apiKeys"),
        Y("tokens"),
        Y("applicationPasswords"),
        Y("privateKeys"),
        Y("certificates"),
        Y("serviceCredentials"),
      );
      const web = any(
        contains("components", "Web application"),
        Y("webExposure"),
      );
      const api = any(
        contains("components", "API"),
        Y("apiExposure"),
        Y("apiFlows"),
      );
      const recommendationCatalog = [
        {
          id: "REC-IAM-001",
          family: "Identity & Access Management",
          title: "Enforce MFA for interactive access",
          description:
            "Passwords alone cannot reliably protect access against credential theft.",
          implementationGuidance:
            "Require phishing-resistant MFA, test recovery paths and eliminate legacy authentication bypasses.",
          priority: "High",
          tags: ["mfa", "authentication"],
          notes: "",
        },

            (!filters.severity || r.severity === filters.severity) &&
            (!filters.riskFamily || r.family === filters.riskFamily),
        );

          library = allRecommendations(s);

            action = getAction(s, risk, id);

            rec &&
            (!filters.recommendationFamily ||
              rec.family === filters.recommendationFamily) &&
            (!filters.status ||
              (filters.status === "Not retained in plan"
                ? !action.selected

          );
        };
        if (filters.recommendationFamily || filters.status)

            detail: s.answers.description || "No description recorded.",
            link: "project:root",
          },
          nodes = [root],
          edges = [];
        const addNode = (n) => {

          edge = (from, to) => {

            detail: r.description,
            severity: r.severity,

            link: "risk:" + r.id,
            reasons: r.reasons,

          if (!r.triggeredBy.length) edge(root.id, riskNode.id);

            if (element) {

              edge(root.id, element.id);
              edge(element.id, riskNode.id);
            }
          });
          mappedRecommendationIds(s, r.id)
            .filter((id) => recMatches(id, r))
            .forEach((id) => {
              const rec = library.find((c) => c.id === id);
              addNode({
                id: "recommendation-" + id,

                label: rec.title,

            edges: result.edges.filter(

                    ? e.from
                    : null

                    ? e.to
                    : null;

                visited.add(target);
                seen.add(target);
                queue.push(target);

      function openRecord(type, index) {
        const collection = collectionFor[type],
          r = index === undefined ? {} : state[collection][index];
        if (!r) return;
        const names = {
          flow: "network flow",
          thirdParty: "third party",
          dataType: "data type",
        };
        let body = `<form id="record-form" data-type="${type}" ${index === undefined ? "" : 'data-index="' + index + '"'}><div class="field-grid">`;
        const choices = {
          authentication: [
            "Unknown",
            "None",
            "Password",
            "API key",
            "OAuth 2.0",
            "mTLS / Certificate",
            "Kerberos",
            "Other",
          ],
          encryption: ["Unknown", "Yes", "No"],
          privilege: ["Unknown", "Read-only", "Standard", "Privileged / admin"],
          dependency: ["Unknown", "Low", "Medium", "High", "Critical"],
          confidentiality: ["Unknown", "Low", "Medium", "High", "Critical"],
          integrity: ["Unknown", "Low", "Medium", "High", "Critical"],
          availability: ["Unknown", "Low", "Medium", "High", "Critical"],
          traceability: ["Unknown", "Low", "Medium", "High", "Critical"],
        };
        body += recordFields[type]
          .map(([key, label]) => {
            const attrs = `name="${key}" ${["source", "destination", "name"].includes(key) ? "required" : ""} maxlength="3000"`;
            return choices[key]
              ? selectField(label, choices[key], r[key] || "Unknown", attrs)
              : key === "comment"
                ? `<label class="field wide"><span class="field-label">${label}</span><textarea name="comment" maxlength="3000">${esc(r[key])}</textarea></label>`
                : inputField(
                    label +
                      (["source", "destination", "name"].includes(key)
                        ? " *"
                        : ""),
                    r[key],
                    attrs,
                  );
          })
          .join("");
        body +=
          '</div><p class="required-note">* Required. Record control details only; never paste credential values.</p></form>';
        showDialog(
          `${index === undefined ? "Add" : "Edit"} ${names[type]}`,
          body,
          `${index === undefined ? "" : `<button class="danger" data-delete-record="${type}" data-index="${index}" style="margin-right:auto">Delete</button>`}<button data-close>Cancel</button><button type="submit" form="record-form" class="primary">Save ${names[type]}</button>`,

      function exportProject() {

          project: {
            name: state.answers.name || "",
            description: state.answers.description || "",
            owner: state.answers.owner || "",
          },
          risks: evaluateRisks(state),
          retainedRecommendations: activeActions(state),
        };
        const blob = new Blob([JSON.stringify(output, null, 2)], {
            type: "application/json",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;

          (state.answers.name || "isp-assessment")
            .replace(/[^a-z0-9_-]+/gi, "-")
            .slice(0, 80) + ".json";

        setTimeout(() => URL.revokeObjectURL(url), 1000);

      function syncActionControls(key) {
        const risk = allRiskDefinitions().find(
          (r) => r.id === key.split("::")[0],
        );
        if (!risk) return;
        const a = getAction(state, risk, key.split("::")[1]);
        document.querySelectorAll("[data-action-key]").forEach((el) => {
          if (el.dataset.actionKey === key) {
            const field = el.dataset.actionField;
            if (field === "selected") el.checked = a.selected;
            else if (document.activeElement !== el) el.value = a[field];
          }
        });
      }
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (
          el.dataset.answer &&
          ["text", "textarea"].includes(fieldIndex[el.dataset.answer]?.type)
        ) {
          state.answers[el.dataset.answer] = el.value;
          changed(false);
        }
        if (
          el.dataset.filter &&
          el.type !== "checkbox" &&
          el.tagName !== "SELECT"
        ) {
          ui[el.dataset.filter] = el.value;
          resetFilterPage(el.dataset.filter);
          refreshResults();
        }
        if (el.dataset.decision === "comments") {
          state.decisions[el.dataset.riskId] = {
            ...(state.decisions[el.dataset.riskId] || {}),
            comments: el.value,
          };
          changed(false);
        }
        if (
          el.dataset.actionField &&
          [
            "owner",
            "due",
            "consultantComment",
            "projectComment",
            "evidence",
          ].includes(el.dataset.actionField)
        )
          setAction(el.dataset.actionKey, el.dataset.actionField, el.value);
        if (el.id === "mapping-search") renderMappingOptions();
        if (el.id === "draft-recommendation-search")
          renderDraftRecommendationOptions();
      });

        const el = event.target;
        if (el.dataset.answer) {

            const values = new Set(state.answers[key] || []);

            state.answers[key] = [...values];
          } else state.answers[key] = el.value;

          refreshResults();
        }
        if (el.dataset.decision && el.dataset.decision !== "comments")
          setDecision(el.dataset.riskId, el.dataset.decision, el.value);
        if (el.dataset.actionField) {
          setAction(
            el.dataset.actionKey,
            el.dataset.actionField,
            el.type === "checkbox" ? el.checked : el.value,
          );
          if (
            ["selected", "decision", "status"].includes(el.dataset.actionField)
          ) {
            render();
            syncActionControls(el.dataset.actionKey);
          }
        }
        if (el.dataset.phase) {
          if (el.value)
            state.process[el.dataset.phase] = { override: el.value };
          else delete state.process[el.dataset.phase];
          changed(true);
        }
        if (el.dataset.mappingId) {
          el.checked
            ? ui.mappingDraft.selected.add(el.dataset.mappingId)
            : ui.mappingDraft.selected.delete(el.dataset.mappingId);
        }
        if (el.dataset.draftRecommendation) {
          const set = new Set(ui.riskDraft.recommendationIds);
          el.checked
            ? set.add(el.dataset.draftRecommendation)
            : set.delete(el.dataset.draftRecommendation);
          ui.riskDraft.recommendationIds = [...set];
        }
        if (el.dataset.mapType) {
          const set = new Set(ui.mapTypes);
          el.checked
            ? set.add(el.dataset.mapType)
            : set.delete(el.dataset.mapType);
          ui.mapTypes = [...set];
          renderMapResults();
        }
      });
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        if (b.dataset.view) {
          ui.view = b.dataset.view;
          render();
          window.scrollTo(0, 0);
        }
        if (b.dataset.section) {
          ui.section = b.dataset.section;
          render();
          window.scrollTo(0, 0);
        }
        if (own(b.dataset, "family")) {
          ui.riskFamily = b.dataset.family;
          ui.riskPage = 1;
          render();
        }
        if (b.dataset.listPage) {
          ui[b.dataset.listPage + "Page"] = Number(b.dataset.page);
          refreshResults();
          $("#main").scrollIntoView({ behavior: "instant" });
        }
        if (b.dataset.risk) openRisk(b.dataset.risk);
        if (b.dataset.libraryRisk) openLibraryRisk(b.dataset.libraryRisk);
        if (b.dataset.recommendation)
          openRecommendation(b.dataset.recommendation);
        if (b.hasAttribute("data-close")) {
          if ($("#recommendation-form") && ui.recommendationReturn)
            returnFromRecommendation();
          else closeDialog();
        }
        if (b.dataset.addRecord) openRecord(b.dataset.addRecord);
        if (b.dataset.editRecord)
          openRecord(b.dataset.editRecord, Number(b.dataset.index));
        if (b.dataset.deleteRecord) {
          state[collectionFor[b.dataset.deleteRecord]].splice(
            Number(b.dataset.index),
            1,
          );
          closeDialog();
          changed(true);
          toast("Record deleted.");
        }
        if (b.dataset.suppress) {
          setDecision(b.dataset.suppress, "hidden", b.dataset.value === "true");
          closeDialog();
          toast(
            b.dataset.value === "true"
              ? "Risk suppressed. Use Show suppressed to restore it."
              : "Risk restored.",
          );
        }
        if (b.dataset.removeAction) {
          setAction(b.dataset.removeAction, "selected", false);
          render();
          toast(
            "Action removed from the plan. Its execution details remain saved.",
          );
        }
        if (b.dataset.useTemplate) {
          if (
            state.customRisks.some((r) => r.id === b.dataset.useTemplate) &&
            !state.activeManualRisks.includes(b.dataset.useTemplate)
          )
            state.activeManualRisks.push(b.dataset.useTemplate);
          closeDialog();
          changed(true);
          toast("Custom risk added to the assessment.");
        }
        if (b.dataset.mapRecommendations)
          openMappingPicker(
            "recommendations",
            b.dataset.mapRecommendations,
            "library",
          );
        if (b.dataset.mapAssessment)
          openMappingPicker(
            "recommendations",
            b.dataset.mapAssessment,
            "assessment",
          );
        if (b.dataset.mapRisks) openMappingPicker("risks", b.dataset.mapRisks);
        if (b.hasAttribute("data-cancel-mapping")) returnFromMapping();
        if (b.hasAttribute("data-save-mapping")) {
          const d = ui.mappingDraft;
          if (d.kind === "recommendations") setMapping(d.id, [...d.selected]);
          else {
            for (const risk of allRiskDefinitions()) {
              const ids = new Set(mappedRecommendationIds(state, risk.id));
              d.selected.has(risk.id) ? ids.add(d.id) : ids.delete(d.id);
              state.riskRecommendationMappings[risk.id] = [...ids];
            }
            changed(true);
          }
          returnFromMapping();
          toast("Mappings saved locally.");
        }
        if (b.dataset.unmapRisk) {
          setMapping(
            b.dataset.unmapRisk,
            mappedRecommendationIds(state, b.dataset.unmapRisk).filter(
              (id) => id !== b.dataset.recommendationId,
            ),
          );
          openLibraryRisk(b.dataset.unmapRisk);
        }
        if (b.dataset.unmapRecommendation) {
          setMapping(
            b.dataset.riskId,
            mappedRecommendationIds(state, b.dataset.riskId).filter(
              (id) => id !== b.dataset.unmapRecommendation,
            ),
          );
          openRecommendation(b.dataset.unmapRecommendation);
        }
        if (b.dataset.createForRisk)
          openRecommendationEditor("", {
            kind: "risk",
            id: b.dataset.createForRisk,
            origin: "library",
          });
        if (b.dataset.createAssessment)
          openRecommendationEditor("", {
            kind: "risk",
            id: b.dataset.createAssessment,
            origin: "assessment",
          });
        if (b.hasAttribute("data-create-for-draft")) {
          captureRiskDraft();
          openRecommendationEditor("", { kind: "draft" });
        }
        if (b.dataset.editRecommendation)
          openRecommendationEditor(b.dataset.editRecommendation, {
            kind: "recommendation",
            id: b.dataset.editRecommendation,
          });
        if (b.hasAttribute("data-cancel-recommendation"))
          returnFromRecommendation();
        if (b.dataset.deleteRecommendation) {
          ui.pendingDeletion = b.dataset.deleteRecommendation;
          const count = Object.values(state.actions).filter(
            (a) => a.recommendationId === ui.pendingDeletion,
          ).length;
          confirmAction(
            "Delete custom recommendation?",
            `This removes the custom recommendation, all its mappings and ${count} project action records. Export a project backup first if you need to preserve them.`,
            "delete-recommendation",
            "Delete Recommendation",
          );
        }
        if (b.dataset.editNext) openNextAction(b.dataset.editNext);
        if (b.dataset.deleteNext) {
          state.nextActions = state.nextActions.filter(
            (a) => a.id !== b.dataset.deleteNext,
          );
          closeDialog();
          changed(true);
        }
        if (b.hasAttribute("data-toggle-next")) {
          ui.nextExpanded = !ui.nextExpanded;
          render();
        }
        if (b.hasAttribute("data-toggle-completed")) {
          ui.nextShowCompleted = !ui.nextShowCompleted;
          render();
        }
        if (b.dataset.editComment) openComment(b.dataset.editComment);
        if (b.dataset.pinComment) {
          const c = state.comments.find((c) => c.id === b.dataset.pinComment);
          if (c) c.pinned = !c.pinned;
          changed(true);
        }
        if (b.hasAttribute("data-toggle-comments")) {
          ui.showAllComments = !ui.showAllComments;
          render();
        }
        if (b.dataset.deleteComment) {
          ui.pendingDeletion = b.dataset.deleteComment;
          confirmAction(
            "Delete this comment?",
            "This removes the comment from the assessment.",
            "delete-comment",
            "Delete Comment",
          );
        }
        if (b.dataset.followLink) followLink(b.dataset.followLink);
        if (b.dataset.mapNode) {
          ui.mapSelected = b.dataset.mapNode;
          renderMapResults();
        }
        if (b.dataset.mapZoom) {
          ui.mapZoom = Math.max(
            0.35,
            Math.min(
              1.6,
              Math.round((ui.mapZoom + Number(b.dataset.mapZoom)) * 100) / 100,
            ),
          );
          renderMapResults();
        }
        if (b.hasAttribute("data-map-clear")) {
          ui.mapSelected = "";
          renderMapResults();
        }
        if (b.dataset.confirm) {
          const cmd = b.dataset.confirm;
          closeDialog();
          if (cmd === "demo") loadDemo();
          if (cmd === "reset") {
            const libraries = {
              customRisks: state.customRisks,
              customRecommendations: state.customRecommendations,
              recommendationOverrides: state.recommendationOverrides,
              riskRecommendationMappings: state.riskRecommendationMappings,
            };
            state = { ...blankState(), ...libraries };
            ui.view = "overview";
            ui.section = "general";
            clearFilters();
            changed(true);
            toast(
              "New project started. Reusable libraries and mappings were preserved.",
            );
          }
          if (cmd === "import" && pendingImport) {
            state = pendingImport;
            pendingImport = null;
            clearFilters();
            ui.view = "overview";
            ui.section = "general";
            changed(true);
            toast(
              "Project loaded. Existing version 1 data is migrated automatically.",
            );
          }
          if (cmd === "delete-recommendation") {
            const id = ui.pendingDeletion;
            if (id?.startsWith("REC-CUSTOM-")) {
              state.customRecommendations = state.customRecommendations.filter(
                (r) => r.id !== id,
              );
              for (const risk of allRiskDefinitions())
                state.riskRecommendationMappings[risk.id] =
                  mappedRecommendationIds(state, risk.id).filter(
                    (v) => v !== id,
                  );
              for (const [key, a] of Object.entries(state.actions))
                if (a.recommendationId === id) delete state.actions[key];
              changed(true);
              toast("Custom recommendation deleted.");
            }
          }
          if (cmd === "delete-comment") {
            state.comments = state.comments.filter(
              (c) => c.id !== ui.pendingDeletion,
            );
            changed(true);
          }
        }
        const command = b.dataset.command;
        if (command === "demo")
          confirmAction(
            "Load the demo project?",
            "This replaces the current assessment and its local catalogue changes with the HR platform demo. Export your work first if needed.",
            "demo",
            "Load Demo",
          );
        if (command === "manual-risk") openManualRisk();
        if (command === "custom-template") openManualRisk(true);
        if (command === "component") openComponent();
        if (command === "new-recommendation") openRecommendationEditor();
        if (command === "new-next") openNextAction();
        if (command === "new-comment") openComment();
        if (command === "analyze") {
          ui.view = "risks";
          render();
          window.scrollTo(0, 0);
        }
        if (command === "qualify") {
          ui.view = "qualification";
          render();
        }
        if (command === "action-plan") {
          ui.view = "actions";
          render();
        }
        if (command === "print") printReport();
        if (command === "map-reset") {
          resetMapFilters();
          render();
        }
        if (command === "clear-risk-filters") {
          Object.assign(ui, {
            riskPage: 1,
            riskSearch: "",
            riskFamily: "",
            riskSeverity: "",
            riskStatus: "",
            showHidden: false,
          });
          render();
        }
        if (command === "clear-action-filters") {
          Object.assign(ui, {
            actionSearch: "",
            actionFamily: "",
            actionSeverity: "",
            actionStatus: "",
            actionOwner: "",
          });
          render();
        }
      });
      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (
          ![
            "record-form",
            "manual-form",
            "component-form",
            "recommendation-form",
            "next-form",
            "comment-form",
          ].includes(form.id)
        )
          return;
        event.preventDefault();
        const data = new FormData(form);
        if (form.id === "record-form") {
          const type = form.dataset.type,
            collection = collectionFor[type],
            index = own(form.dataset, "index")
              ? Number(form.dataset.index)
              : undefined;
          const record = {
            id: index === undefined ? newId(type) : state[collection][index].id,
            ...Object.fromEntries(
              recordFields[type].map(([key]) => [
                key,
                safeText(data.get(key), 3000).trim(),
              ]),
            ),
          };
          if (index === undefined) state[collection].push(record);
          else state[collection][index] = record;
          if (type === "flow") state.answers.network = "yes";
          if (type === "thirdParty") state.answers.thirdParty = "yes";
          if (type === "dataType") state.answers.data = "yes";
        }
        if (form.id === "component-form") {
          const name = data.get("name").trim();
          if (!name) return;
          if (![...COMPONENTS, ...state.componentsCustom].includes(name))
            state.componentsCustom.push(name);
          state.answers.components = [
            ...new Set([...(state.answers.components || []), name]),
          ];
        }
        if (form.id === "manual-form") {
          const draft = captureRiskDraft(),
            risk = {
              id: uuid(),
              title: draft.title.trim(),
              severity: draft.severity,
              family: draft.customFamily.trim() || draft.family,
              description: draft.description.trim(),
              justification: draft.justification.trim(),
              tags: ["Custom"],
            };
          if (!risk.title || !risk.description || !risk.justification) {
            toast("Complete the required risk details.");
            return;
          }
          state.customRisks.push(risk);
          state.decisions[risk.id] = { elementIds: draft.elementIds };
          if (!draft.library) state.activeManualRisks.push(risk.id);
          state.riskRecommendationMappings[risk.id] = draft.recommendationIds;
          ui.riskDraft = null;
        }
        if (form.id === "recommendation-form") {
          const id = form.dataset.id || newId("REC-CUSTOM"),
            r = {
              id,
              title: data.get("title").trim(),
              family: data.get("family").trim(),
              priority: data.get("priority"),
              description: data.get("description").trim(),
              implementationGuidance: data.get("implementationGuidance").trim(),
              tags: [
                ...new Set(
                  data
                    .get("tags")
                    .split(",")
                    .map((v) => v.trim())
                    .filter(Boolean),
                ),
              ].slice(0, 30),
              notes: data.get("notes").trim(),
            };
          if (
            !r.title ||
            !r.family ||
            !r.description ||
            !r.implementationGuidance
          ) {
            toast("Complete the required recommendation details.");
            return;
          }
          if (recommendationCatalog.some((c) => c.id === id))
            state.recommendationOverrides[id] = r;
          else {
            const index = state.customRecommendations.findIndex(
              (c) => c.id === id,
            );
            if (index >= 0) state.customRecommendations[index] = r;
            else state.customRecommendations.push(r);
          }
          changed(true);
          returnFromRecommendation(id);
          toast(
            "Reusable recommendation saved. Project statuses were preserved.",
          );
          return;
        }
        if (form.id === "next-form") {
          const a = {
            id: form.dataset.id || newId("next"),
            title: data.get("title").trim(),
            description: data.get("description").trim(),
            side: data.get("side"),
            owner: data.get("owner").trim(),
            due: data.get("due"),
            status: data.get("status"),
            link: data.get("link"),
          };
          if (!a.title) return;
          if (form.dataset.automatic === "true")
            state.nextActionOverrides[a.id] = a;
          else {
            const index = state.nextActions.findIndex((n) => n.id === a.id);
            if (index >= 0) state.nextActions[index] = a;
            else state.nextActions.push(a);
          }
        }
        if (form.id === "comment-form") {
          const c = {
            id: form.dataset.id || newId("comment"),
            text: data.get("text").trim(),
            author: data.get("author").trim(),
            date: data.get("date"),
            category: data.get("category"),
            link: data.get("link"),
            pinned: data.has("pinned"),
          };
          if (!c.text) return;
          const index = state.comments.findIndex(
            (c) => c.id === form.dataset.id,
          );
          if (index >= 0) state.comments[index] = c;
          else state.comments.push(c);
        }
        closeDialog();
        changed(true);
        toast("Saved to the assessment.");
      });
      function resetMapFilters() {
        Object.assign(ui, {
          mapSearch: "",
          mapScope: "applicable",
          mapSeverity: "",
          mapRiskFamily: "",
          mapRecommendationFamily: "",
          mapStatus: "",
          mapTypes: [...MAP_TYPES],
          mapSelected: "",
          mapZoom: 0.8,
        });
      }
      function clearFilters() {
        Object.assign(ui, {
          riskPage: 1,
          libraryPage: 1,
          recommendationPage: 1,
          riskSearch: "",
          riskFamily: "",
          riskSeverity: "",
          riskStatus: "",
          showHidden: false,
          actionSearch: "",
          actionFamily: "",
          actionSeverity: "",
          actionStatus: "",
          actionOwner: "",
          librarySearch: "",
          libraryFamily: "",
          recommendationSearch: "",
          recommendationFamily: "",
          recommendationPriority: "",
          recommendationTag: "",
          nextExpanded: false,
          nextShowCompleted: false,
          showAllComments: false,
        });
        resetMapFilters();
      }

      $("#save-btn").addEventListener("click", () => saveLocal(true));
      $("#load-btn").addEventListener("click", () => $("#import-file").click());
      $("#import-file").addEventListener("change", (e) => {
        importProject(e.target.files[0]);
        e.target.value = "";
      });
      $("#reset-btn").addEventListener("click", () =>
        confirmAction(
          "Start a new assessment?",
          "This clears project data, actions, process overrides and comments. Reusable library definitions and mappings are preserved. Export a backup first if needed.",
          "reset",
          "Reset Assessment",
        ),
      );
      $("#export-btn").addEventListener("click", () => {
        const menu = $("#export-menu");
        menu.hidden = !menu.hidden;
        $("#export-btn").setAttribute("aria-expanded", String(!menu.hidden));
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".export-wrap")) {
          $("#export-menu").hidden = true;
          $("#export-btn").setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          $("#export-menu").hidden = true;
          $("#export-btn").setAttribute("aria-expanded", "false");
        }
      });
      $("#json-btn").addEventListener("click", () => {
        exportProject();
        $("#export-menu").hidden = true;
        $("#export-btn").setAttribute("aria-expanded", "false");
      });
      $("#report-btn").addEventListener("click", () => {
        $("#export-menu").hidden = true;
        $("#export-btn").setAttribute("aria-expanded", "false");
        printReport();
      });
      $("#dialog").addEventListener("click", (e) => {
        if (e.target === $("#dialog")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeDialog();
        }
      });
      window.addEventListener("beforeprint", buildReport);
      window.addEventListener("pagehide", () => {
        if (saveTimer) saveLocal(false);
      });
      $("#dialog").addEventListener("cancel", (event) => {
        if ($("#recommendation-form") && ui.recommendationReturn) {
          event.preventDefault();
          returnFromRecommendation();
        }
      });
      restoreLocal();
      clearFilters();
      populateIcons();
      render();
    </script>
  </body>
</html>
