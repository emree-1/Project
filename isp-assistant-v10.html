<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ISP Assistant · Security assessment workspace</title>
    <style>
      /* Presentation — all resources are embedded; no network access is used. */
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --radius: 13px;
        --attention: #9b6a12;
        --attention-surface: #fff8e8;
        --surface-subtle: #f7faf9;
        --nav: #132b32;
        --nav-muted: #9eb4b8;
        --bg: #f4f6f6;
        --paper: #fff;
        --ink: #19343b;
        --muted: #65787d;
        --line: #dce5e5;
        --border: var(--line);
        --accent: var(--teal);
        --teal: #12786e;
        --light: #e8f4f0;
        --critical: #ae293e;
        --high: #b45e18;
        --medium: #946b08;
        --low: #226895;
        --info: #64737e;
        --shadow: 0 2px 10px #17353c05;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      a,
      input,
      select,
      textarea,
      summary {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #4ca89c;
      }
      button {
        color: inherit;
      }
      button.primary {
        background: var(--teal);
        color: white;
        border-color: var(--teal);
      }
      button.primary:hover {
        background: #0c625a;
      }
      button.danger {
        color: var(--critical);
      }
      button,
      .button {
        border: 1px solid var(--line);
        background: white;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        line-height: 1.25;
      }
      button:hover {
        background: #f1f6f5;
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
      }
      button.small {
        font-size: 12px;
        padding: 6px 9px;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.9px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      h3 {
        font-size: 15px;
      }
      p {
        line-height: 1.65;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.6px;
        font-size: 10px;
        font-weight: 750;
        color: var(--teal);
        margin-bottom: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--nav);
        color: white;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        letter-spacing: -0.4px;
        font-weight: 750;
        margin: 0 10px 34px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 38px;
        border-radius: 10px;
        background: #1c514f;
        color: #95dcc3;
      }
      .brand-mark svg {
        width: 24px;
        height: 24px;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 2px;
        display: block;
        font-weight: 500;
        color: var(--nav-muted);
        margin-top: 3px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 1.7px;
        color: var(--nav-muted);
        margin: 0 12px 10px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        background: transparent;
        border: 0;
        justify-content: flex-start;
        color: #b7c9cc;
        padding: 12px;
        border-radius: 7px;
        text-align: left;
        font-weight: 500;
      }
      .nav button.active {
        background: #24434a;
        color: white;
        box-shadow: inset 3px 0 #6dc3a7;
      }
      .nav button:hover {
        background: #203e45;
      }
      .nav button svg {
        margin-right: 4px;
      }
      .nav .count {
        margin-left: auto;
        font-size: 11px;
        background: #ffffff15;
        color: #dcece8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 32px 10px 0;
        color: #b7c9cc;
        font-size: 12px;
      }
      .local-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: #75c2a4;
      }
      .sidebar-bottom p {
        font-size: 11px;
        color: #90a9ae;
        margin: 0;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        min-height: 74px;
        background: #ffffffed;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 12px 34px;
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(12px);
      }
      .project-caption {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .project-title {
        font-size: 14px;
        font-weight: 700;
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-progress {
        width: 130px;
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .progress-track {
        height: 4px;
        background: #e6eeed;
        border-radius: 4px;
        margin-top: 7px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        background: var(--teal);
        height: 100%;
        transition: width 0.2s;
      }
      .top-tools {
        display: flex;
        gap: 7px;
      }
      .top-tools button {
        font-size: 12px;
      }
      .export-wrap {
        position: relative;
      }
      .export-menu {
        position: absolute;
        right: 0;
        top: 44px;
        min-width: 205px;
        background: white;
        padding: 6px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px #14363c20;
        border-radius: 8px;
      }
      .export-menu button {
        display: flex;
        width: 100%;
        justify-content: flex-start;
        border: 0;
        padding: 11px;
      }
      .content {
        max-width: 1460px;
        margin: auto;
        padding: 34px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 27px;
      }
      .page-heading p {
        margin-bottom: 0;
        color: var(--muted);
        max-width: 700px;
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .tools-label {
        margin-top: var(--space-6);
      }
      .save-state {
        color: var(--teal);
        font-size: 12px;
        align-self: center;
        white-space: nowrap;
      }
      .sub-tabs {
        display: flex;
        gap: var(--space-2);
        border-bottom: 1px solid var(--line);
        margin-bottom: var(--space-4);
        overflow-x: auto;
      }
      .sub-tabs button {
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: var(--space-3) var(--space-4);
        white-space: nowrap;
        color: var(--muted);
        text-align: left;
      }
      .sub-tabs button.active {
        border-bottom-color: var(--teal);
        color: var(--ink);
      }
      .sub-tabs small {
        display: block;
        font-size: 10px;
        font-weight: 400;
      }
      .workspace-content {
        padding: 0 var(--space-6) var(--space-5);
      }
      .workspace-content > .panel,
      .workspace-content > .workshop-panel,
      .workspace-content > .inventory-section {
        box-shadow: none;
        border: 0;
        border-radius: 0;
        padding: var(--space-5) 0;
        margin: 0;
      }
      .workspace-content > * + * {
        border-top: 1px solid var(--line) !important;
      }
      .project-fields {
        max-width: 940px;
      }
      .qualification-workspace .workspace-content > .panel {
        box-shadow: none;
        border: 0;
        border-radius: 0;
        padding: var(--space-5) 0;
        margin: 0;
      }
      .qualification-workspace .workspace-content > .panel + .panel {
        border-top: 1px solid var(--line);
      }
      .snapshot,
      .progress-panel,
      .next-panel,
      .assessment-details {
        padding: var(--space-5) var(--space-6);
        margin-bottom: var(--space-4);
      }
      .snapshot h2 {
        font-size: 23px;
        margin-bottom: 3px;
      }
      .snapshot p {
        margin-bottom: var(--space-2);
      }
      .progress-line {
        display: flex;
        justify-content: space-between;
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--line);
      }
      .progress-line span {
        color: var(--muted);
      }
      .stage-details {
        margin-top: var(--space-4);
      }
      .stage-detail-list button {
        width: 100%;
        display: flex;
        justify-content: space-between;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        text-align: left;
      }
      .kpi-strip {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-5);
        align-items: baseline;
        padding: var(--space-3) var(--space-5);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: var(--space-4);
      }
      .kpi-strip strong {
        font-size: 18px;
      }
      .kpi-strip span {
        color: var(--muted);
      }
      .primary-filters {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .secondary-filters {
        border-top: 1px solid var(--line);
        padding-top: var(--space-3);
      }
      .secondary-filters[hidden] {
        display: none;
      }
      .knowledge-tools {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .knowledge-row {
        padding: var(--space-4);
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: var(--space-4);
      }
      .knowledge-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--line);
      }
      .knowledge-entry h3 {
        margin: 3px 0 var(--space-2);
      }
      .knowledge-entry small {
        color: var(--muted);
      }
      .knowledge-entry-end {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .knowledge-entry .tags {
        margin: 0;
      }
      .asset-card.clickable-row:hover {
        border-color: #b4d8cf;
        background: var(--surface-subtle);
      }
      .knowledge-row small {
        color: var(--muted);
      }
      .risk-status {
        color: var(--muted);
      }
      .risk-list .risk-card {
        padding: var(--space-4) var(--space-5);
      }
      .risk-list .risk-card .risk-trigger {
        background: transparent;
        padding: 0;
        border: 0;
        margin: var(--space-2) 0;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .risk-list .risk-card .risk-trigger svg {
        width: 14px;
        height: 14px;
      }
      .detail-groups > section {
        padding: var(--space-5) 0;
        border-bottom: 1px solid var(--line);
      }
      .risk-detail-summary {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        color: var(--muted);
        margin-bottom: var(--space-4);
      }
      .detail-groups > section h3 {
        margin-bottom: var(--space-4);
      }
      .segmented {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        max-width: 100%;
      }
      .segment,
      .segmented label {
        position: relative;
        cursor: pointer;
        border-right: 1px solid var(--line);
        font-size: 12px;
      }
      .segment:last-child {
        border-right: 0;
      }
      .segment input,
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .segment span,
      .segmented span {
        display: block;
        padding: 10px 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .segment input:checked + span,
      .segmented input:checked + span {
        background: var(--light);
        color: var(--teal);
        font-weight: 700;
      }
      .segment.uncertain-choice input:checked + span {
        background: var(--attention-surface);
        color: var(--attention);
      }
      .segment input:focus-visible + span,
      .segmented input:focus-visible + span {
        outline: 3px solid #4ca89c;
        outline-offset: -3px;
      }

      .panel-head {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head h2 {
        margin-bottom: 5px;
      }
      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .panel-body {
        padding: 24px;
      }
      .section-description {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 25px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-4);
      }
      .field {
        display: block;
        min-width: 0;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field-label {
        font-size: 12px;
        font-weight: 650;
        display: block;
        margin-bottom: 9px;
      }
      .field-help {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: block;
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        width: 100%;
        border: 1px solid #cddbdc;
        border-radius: 10px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        min-width: 0;
      }
      input::placeholder,
      textarea::placeholder {
        color: #93a0a3;
      }
      textarea {
        resize: vertical;
        min-height: 86px;
        line-height: 1.6;
      }
      input[type="checkbox"] {
        accent-color: var(--teal);
        width: 16px;
        height: 16px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 6px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }
      .chip:has(input:checked) {
        border-color: #5ca89a;
        background: var(--light);
        color: #09675d;
      }
      .chip input {
        margin: 0;
      }
      .form-divider {
        grid-column: 1/-1;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        margin-top: 8px;
        font-weight: 650;
        font-size: 13px;
      }
      .callout {
        padding: 14px 17px;
        border-radius: 7px;
        background: #eef5f5;
        color: #47656a;
        font-size: 12px;
        line-height: 1.7;
        display: flex;
        gap: 10px;
      }
      .callout.warm {
        background: #fbf5e9;
        color: #8c662a;
      }
      .section-footer {
        border-top: 1px solid var(--line);
        padding: 17px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-footer small {
        font-size: 11px;
      }
      .list-header {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin: 28px 0 14px;
      }
      .list-header h3 {
        margin: 0;
      }
      .entity-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 15px 17px;
        margin: 9px 0;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .entity-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--light);
        border-radius: 7px;
        color: var(--teal);
        flex-shrink: 0;
      }
      .entity-content {
        flex: 1;
        min-width: 0;
      }
      .entity-content strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }
      .entity-content small {
        font-size: 11px;
        line-height: 1.6;
        display: block;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.1px;
        font-weight: 700;
        padding: 4px 8px;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sev-Critical {
        background: #fbeaed;
        color: var(--critical);
      }
      .sev-High {
        background: #fff0e4;
        color: var(--high);
      }
      .sev-Medium {
        background: #fbf4d9;
        color: var(--medium);
      }
      .sev-Low {
        background: #eaf3fc;
        color: var(--low);
      }
      .sev-Informational {
        background: #edf1f4;
        color: var(--info);
      }
      .neutral {
        background: #eef3f3;
        color: #61767b;
      }
      .good {
        background: var(--light);
        color: var(--teal);
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .filters input:not([type="checkbox"]) {
        flex: 2;
        min-width: 150px !important;
      }
      .filters select {
        width: auto;
        flex: 1;
        min-width: 115px;
      }
      .filters label {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .risk-list {
        padding: 0 20px;
      }
      .risk-card {
        padding: 21px 0;
        border-bottom: 1px solid var(--line);
      }
      .risk-card:last-child {
        border: 0;
      }
      .risk-card-top {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .risk-card h3 {
        font-size: 14px;
        line-height: 1.55;
        margin: 8px 0 7px;
      }
      .risk-link {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        display: inline;
        font-weight: 650;
        line-height: inherit;
      }
      .risk-link:hover {
        background: transparent;
        color: var(--teal);
        text-decoration: underline;
      }
      .risk-card p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 13px;
      }
      .risk-meta {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 10px;
        color: var(--muted);
      }
      .risk-id {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .risk-trigger {
        font-size: 11px;
        background: #f4f7f7;
        padding: 9px 11px;
        border-radius: 5px;
        margin: 12px 0;
        color: #547076;
      }
      .family-button {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        padding: 10px 0;
        border-radius: 0;

      /* Evidence graph: nodes and edges use the engine's triggeredBy and catalogue mappings. */
      const MAP_TYPES = [

      function buildProjectGraph(s, filters = {}) {
        let risks = evaluateRisks(s).filter(
          (r) =>
            !r.hidden &&
            r.status !== "Not Applicable" &&
            (filters.resolved ||
              !["Mitigated", "Accepted"].includes(r.status)) &&
            (filters.scope === "all" || r.status !== "To Be Determined") &&
            (!filters.severity || r.severity === filters.severity) &&
            (filters.severity || r.severity !== "Low" || filters.showLow) &&
            (filters.severity ||
              r.severity !== "Informational" ||
              filters.showInfo) &&
            (!filters.riskFamily || r.family === filters.riskFamily),
        );
        const elements = getProjectElements(s),
          library = allRecommendations(s);
        const recMatches = (id, risk) => {
          const rec = library.find((c) => c.id === id),
            action = getAction(s, risk, id);
          return (
            rec &&
            rec.active !== false &&
            (filters.allRecommendations ||
              action.selected ||
              filters.status === "Not retained in plan") &&
            (!filters.recommendationFamily ||
              rec.family === filters.recommendationFamily) &&
            (!filters.status ||
              (filters.status === "Not retained in plan"
                ? !action.selected
                : action.status === filters.status))
          );
        };
        if (filters.recommendationFamily || filters.status)
          risks = risks.filter((r) =>
            mappedRecommendationIds(s, r.id).some((id) => recMatches(id, r)),
          );
        const root = {
            id: "project-root",
            type: "Project",
            label: s.answers.name || "Untitled project",
            detail:
              (s.answers.description || "No description recorded.") +
              "\n\n" +
              qualificationMapMetadataFor(s),
            link: "project:root",
          },
          nodes = [root],
          edges = [];
        const addNode = (n) => {
            if (!nodes.some((v) => v.id === n.id)) nodes.push(n);
          },
          edge = (from, to) => {
            if (!edges.some((e) => e.from === from && e.to === to))
              edges.push({ from, to });
          };
        risks.forEach((r) => {
          const riskNode = {
            id: "risk-" + r.id,
            type: "Risks",
            label: r.title,
            detail: r.description,
            severity: r.severity,
            status: r.status,
            riskId: r.id,
            link: "risk:" + r.id,
            reasons: r.reasons,
          };
          addNode(riskNode);
          if (!r.triggeredBy.length) edge(root.id, riskNode.id);
          r.triggeredBy.forEach((t) => {
            const element = elements.find((e) => e.id === t.id);
            if (element) {
              addNode({ ...element, reason: t.reason });
              edge(root.id, element.id);
              edge(element.id, riskNode.id);
            }
          });
          mappedRecommendationIds(s, r.id)
            .filter((id) => recMatches(id, r))
            .forEach((id) => {
              const rec = library.find((c) => c.id === id);
              addNode({
                id: "recommendation-" + id,
                type: "Recommendations",
                label: rec.title,
                detail: rec.implementationGuidance,
                recommendationId: id,
                link: "recommendation:" + id,
              });
              edge(riskNode.id, "recommendation-" + id);
            });
        });
        // Main project elements remain visible even before a risk has been reviewed.
        const mainIds = new Set([
          ...componentRecords(s).map((c) => c.id),
          ...s.flows.map((r) => r.id),
          ...s.profiles
            .filter((r) => filters.technical || !MACHINE_TYPES.includes(r.type))
            .map((r) => r.id),
          ...s.thirdParties.map((r) => r.id),
          ...s.dataTypes.map((r) => r.id),
        ]);
        for (const element of elements.filter((e) => mainIds.has(e.id))) {
          addNode(element);
          edge(root.id, element.id);
        }
        for (const flow of inventoryRows(s, "flows"))
          for (const key of ["source", "destination", "dataType"]) {
            const ref = flow[key + "Ref"] || matchReference(s, key, flow[key]);
            if (
              ref &&
              nodes.some((n) => n.id === ref) &&
              nodes.some((n) => n.id === flow.id)
            )
              edge(ref, flow.id);
          }
        if (!filters.technical) {
          const hidden = new Set(
            s.profiles
              .filter((r) => MACHINE_TYPES.includes(r.type))
              .map((r) => r.id),
          );
          for (let i = nodes.length - 1; i >= 0; i--)
            if (hidden.has(nodes[i].id)) nodes.splice(i, 1);
          for (let i = edges.length - 1; i >= 0; i--)
            if (hidden.has(edges[i].from) || hidden.has(edges[i].to))
              edges.splice(i, 1);
        }
        let result = { nodes, edges };
        const q = (filters.search || "").trim().toLowerCase();
        if (q) {
          const matches = nodes.filter((n) =>
            [n.id, n.label, n.detail].join(" ").toLowerCase().includes(q),
          );
          const keep = new Set();
          matches.forEach((n) =>
            relatedGraphNodes(result, n.id).forEach((id) => keep.add(id)),
          );
          result = {
            nodes: nodes.filter((n) => keep.has(n.id)),
            edges: edges.filter((e) => keep.has(e.from) && keep.has(e.to)),
          };
        }
        if (filters.types) {
          const keep = new Set(
            result.nodes
              .filter(
                (n) => n.type === "Project" || filters.types.includes(n.type),
              )
              .map((n) => n.id),
          );
          result = {
            nodes: result.nodes.filter((n) => keep.has(n.id)),
            edges: result.edges.filter(
              (e) => keep.has(e.from) && keep.has(e.to),
            ),
          };
        }
        return result;
      }
      function relatedGraphNodes(graph, id) {
        const seen = new Set([id]);
        function walk(direction) {
          const visited = new Set([id]),
            queue = [id];
          while (queue.length) {
            const current = queue.shift();
            for (const e of graph.edges) {
              const target =
                direction === "up"
                  ? e.to === current
                    ? e.from
                    : null
                  : e.from === current
                    ? e.to
                    : null;
              if (target && !visited.has(target)) {
                visited.add(target);
                seen.add(target);
                queue.push(target);
              }
            }
          }
        }
        walk("up");
        walk("down");
        return seen;
      }

      /* Delegated events: catalogue edits and project execution stay separate. */
      function syncActionControls(key) {
        const risk = allRiskDefinitions().find(
          (r) => r.id === key.split("::")[0],
        );
        if (!risk) return;
        const a = getAction(state, risk, key.split("::")[1]);
        document.querySelectorAll("[data-action-key]").forEach((el) => {
          if (el.dataset.actionKey === key) {
            const field = el.dataset.actionField;
            if (field === "selected") el.checked = a.selected;
            else if (document.activeElement !== el) el.value = a[field];
          }
        });
      }
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (
          el.dataset.answer &&
          ["text", "textarea"].includes(fieldIndex[el.dataset.answer]?.type)
        ) {
          state.answers[el.dataset.answer] = el.value;
          changed(false);
        }
        if (
          el.dataset.filter &&
          el.type !== "checkbox" &&
          el.tagName !== "SELECT"
        ) {
          ui[el.dataset.filter] = el.value;
          resetFilterPage(el.dataset.filter);
          refreshResults();
        }
        if (el.dataset.decision === "comments") {
          state.decisions[el.dataset.riskId] = {
            ...(state.decisions[el.dataset.riskId] || {}),
            comments: el.value,
          };
          changed(false);
        }
        if (
          el.dataset.actionField &&
          ["due", "consultantComment", "projectComment", "evidence"].includes(
            el.dataset.actionField,
          )
        )
          setAction(el.dataset.actionKey, el.dataset.actionField, el.value);
        if (el.id === "mapping-search") renderMappingOptions();
        if (el.id === "draft-recommendation-search")
          renderDraftRecommendationOptions();
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (el.dataset.answer) {
          const key = el.dataset.answer,
            f = fieldIndex[key];
          if (key === "components") {
            if (el.checked) addProjectComponent(state, el.value, el.value);
            else
              for (const c of componentRecords(state).filter(
                (c) => c.name === el.value || c.kind === el.value,
              ))
                removeProjectComponent(c.id);
          } else if (f.type === "multi") {
            const values = new Set(state.answers[key] || []);
            el.checked ? values.add(el.value) : values.delete(el.value);
            state.answers[key] = [...values];
          } else state.answers[key] = el.value;
          changed(!["text", "textarea"].includes(f.type));
        }
        if (
          el.dataset.filter &&
          (el.type === "checkbox" || el.tagName === "SELECT")
        ) {
          ui[el.dataset.filter] =
            el.type === "checkbox" ? el.checked : el.value;
          resetFilterPage(el.dataset.filter);
          refreshResults();
        }
        if (el.dataset.decision && el.dataset.decision !== "comments")
          setDecision(el.dataset.riskId, el.dataset.decision, el.value);
        if (el.dataset.actionField) {
          setAction(
            el.dataset.actionKey,
            el.dataset.actionField,
            el.type === "checkbox" ? el.checked : el.value,
          );
          if (
            ["selected", "decision", "status", "ispReview"].includes(
              el.dataset.actionField,
            )
          ) {
            refreshAfterActionChange(el);
          }
        }
        if (el.dataset.phase) {
          if (el.value)
            state.process[el.dataset.phase] = { override: el.value };
          else delete state.process[el.dataset.phase];
          changed(true);
        }
        if (el.dataset.mappingId) {
          el.checked
            ? ui.mappingDraft.selected.add(el.dataset.mappingId)
            : ui.mappingDraft.selected.delete(el.dataset.mappingId);
        }
        if (el.dataset.draftRecommendation) {
          const set = new Set(ui.riskDraft.recommendationIds);
          el.checked
            ? set.add(el.dataset.draftRecommendation)
            : set.delete(el.dataset.draftRecommendation);
          ui.riskDraft.recommendationIds = [...set];
        }
        if (el.dataset.mapType) {
          const set = new Set(ui.mapTypes);
          el.checked
            ? set.add(el.dataset.mapType)
            : set.delete(el.dataset.mapType);
          ui.mapTypes = [...set];
          renderMapResults();
        }
      });

      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (
          ![
            "record-form",
            "manual-form",
            "component-form",
            "recommendation-form",
            "next-form",
            "comment-form",
          ].includes(form.id)
        )
          return;
        event.preventDefault();
        const data = new FormData(form);
        if (form.id === "record-form") {
          const type = form.dataset.type,
            collection = collectionFor[type],
            index = own(form.dataset, "index")
              ? Number(form.dataset.index)
              : undefined;
          const record = {
            id: index === undefined ? newId(type) : state[collection][index].id,
            ...Object.fromEntries(
              recordFields[type].map(([key]) => [
                key,
                safeText(data.get(key), 3000).trim(),
              ]),
            ),
          };
          if (index === undefined) state[collection].push(record);
          else state[collection][index] = record;
          if (type === "flow") state.answers.network = "yes";
          if (type === "thirdParty") state.answers.thirdParty = "yes";
          if (type === "dataType") state.answers.data = "yes";
        }
        if (form.id === "component-form") {
          const name = data.get("name").trim();
          if (!name) return;
          addProjectComponent(state, name, "");
        }
        if (form.id === "manual-form") {
          const draft = captureRiskDraft(),
            risk = {
              id: uuid(),
              title: draft.title.trim(),
              severity: draft.severity,
              family: draft.customFamily.trim() || draft.family,
              description: draft.description.trim(),
              justification: draft.justification.trim(),
              tags: ["Custom"],
            };
          if (!risk.title || !risk.description || !risk.justification) {
            toast("Complete the required risk details.");
            return;
          }
          state.customRisks.push(risk);
          state.decisions[risk.id] = { elementIds: draft.elementIds };
          if (!draft.library) state.activeManualRisks.push(risk.id);
          state.riskRecommendationMappings[risk.id] = draft.recommendationIds;
          ui.riskDraft = null;
        }
        if (form.id === "recommendation-form") {
          const id = form.dataset.id || newId("REC-CUSTOM"),
            r = {
              id,
              title: data.get("title").trim(),
              family: data.get("family").trim(),
              priority: data.get("priority"),
              description: data.get("description").trim(),
              implementationGuidance: data.get("implementationGuidance").trim(),
              tags: [
                ...new Set(
                  data
                    .get("tags")
                    .split(",")
                    .map((v) => v.trim())
                    .filter(Boolean),
                ),
              ].slice(0, 30),
              notes: data.get("notes").trim(),
              active: data.has("active"),
            };
          if (
            !r.title ||
            !r.family ||
            !r.description ||
            !r.implementationGuidance
          ) {
            toast("Complete the required recommendation details.");
            return;
          }
          if (recommendationCatalog.some((c) => c.id === id))
            state.recommendationOverrides[id] = r;
          else {
            const index = state.customRecommendations.findIndex(
              (c) => c.id === id,
            );
            if (index >= 0) state.customRecommendations[index] = r;
            else state.customRecommendations.push(r);
          }
          changed(true);
          returnFromRecommendation(id);
          toast(
            "Reusable recommendation saved. Project statuses were preserved.",
          );
          return;
        }
        if (form.id === "next-form") {
          const a = {
            id: form.dataset.id || newId("next"),
            title: data.get("title").trim(),
            description: data.get("description").trim(),
            side: data.get("side"),
            owner: data.get("owner").trim(),
            due: data.get("due"),
            status: data.get("status"),
            link: data.get("link"),
          };
          if (!a.title) return;
          if (form.dataset.automatic === "true")
            state.nextActionOverrides[a.id] = a;
          else {
            const index = state.nextActions.findIndex((n) => n.id === a.id);
            if (index >= 0) state.nextActions[index] = a;
            else state.nextActions.push(a);
          }
        }
        if (form.id === "comment-form") {
          const c = {
            id: form.dataset.id || newId("comment"),
            text: data.get("text").trim(),
            author: data.get("author").trim(),
            date: data.get("date"),
            category: data.get("category"),
            link: data.get("link"),
            pinned: data.has("pinned"),
          };
          if (!c.text) return;
          const index = state.comments.findIndex(
            (c) => c.id === form.dataset.id,
          );
          if (index >= 0) state.comments[index] = c;
          else state.comments.push(c);
        }
        closeDialog();
        changed(true);
        toast("Saved to the assessment.");
      });

        if (c.any) out.any = c.any.map((v) => canonicalCondition(v, depth + 1));
        if (c.where) out.where = canonicalCondition(c.where, depth + 1);
        if (c.dataAsset)

        }
        for (const key of ["flows", "profiles", "thirdParties", "dataTypes"])

              row && typeof row === "object"

                        "description",
                        "hostingDetails",

                        "name",
                        "volumeNotes",
                        "legacyQualification",

            c = componentRecords(state).find((c) => c.id === el.value);
          row[key + "Ref"] = c?.id || "";
          if (c) {
            row[key] = c.name;
            const input = $("#detail-flows-" + key);
            if (input) input.value = c.name;
          }
        }
      });
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el.dataset.inlineImComment) {
          state.identityManagement[el.dataset.inlineImComment] = el.value;
          changed(false);
        }
        if (
          el.dataset.draftField &&
          ui.inventoryDraft?.key === "flows" &&
          ["source", "destination"].includes(el.dataset.draftField)
        ) {
          const row = ui.inventoryDraft.row,
            key = el.dataset.draftField;
          const c = componentRecords(state).find(
            (c) => c.id === row[key + "Ref"],
          );
          if (c && c.name !== el.value) row[key + "Ref"] = "";
        }
      });

      /* v9 qualification vocabulary and legacy adapters. */
      function classificationLabel(value) {
        const v = String(value || "").trim(),
          m = v.match(
            /^\[?C([1-4])\]?(?:\s*[·—–-]?\s*(?:Public|Internal|Confidential|Strictly Confidential))?$/i,
          );
        return m
          ? DATA_CLASSIFICATIONS[Number(m[1]) - 1]
          : v === "Public"
            ? DATA_CLASSIFICATIONS[0]
            : null;
      }
      function canonicalRuleValue(condition, value) {
        if (Array.isArray(value))
          return value.map((v) => canonicalRuleValue(condition, v));
        const v = canonicalAnswer(value);
        if (condition.field === "classification")
          return classificationLabel(v) || v;
        if (condition.field === "nature" && v === "Personal Data") return "PII";
        return v;
      }
      function retiredQualificationCondition(c, inData = false, depth = 0) {
        if (!c || typeof c !== "object" || depth > 12) return false;
        if (
          [
            "dataExposure",
            "dataExposureDescription",
            "hasFinancialData",
          ].includes(c.key || c.nonempty || c.answered)
        )
          return true;
        if (
          c.key === "dataClasses" &&
          []
            .concat(c.value || [])
            .some(
              (v) =>
                ![
                  "Personal",
                  "Sensitive",
                  "Public",
                  "Business-critical",
                  "Technical Data",
                  "Other",
                  TBD,
                ].includes(canonicalAnswer(v)),
            )
        )
          return true;
        if (inData) {
          const values = [].concat(c.value || []);
          if (values.some(notApplicable)) return true;
          if (
            c.field === "nature" &&
            values.some(
              (v) =>
                !DATA_NATURES.includes(canonicalAnswer(v)) &&
                v !== "Personal Data",
            )
          )
            return true;
          if (
            c.field === "volume" &&
            values.some((v) => !DATA_VOLUMES.includes(canonicalAnswer(v)))
          )
            return true;
        }
        return (
          (c.dataAsset &&
            retiredQualificationCondition(c.dataAsset, true, depth + 1)) ||
          (c.all || c.any || []).some((v) =>
            retiredQualificationCondition(v, inData, depth + 1),
          )
        );
      }
      function prepareV9Input(raw) {
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) return raw;
        const r = { ...raw, answers: { ...(raw.answers || {}) } },
          metadata =
            raw.legacyMetadata &&
            typeof raw.legacyMetadata === "object" &&
            !Array.isArray(raw.legacyMetadata)
              ? JSON.parse(JSON.stringify(raw.legacyMetadata))
              : {};
        if (
          Object.hasOwn(r.answers, "dataExposure") ||
          Object.hasOwn(r.answers, "dataExposureDescription")
        )
          metadata.dataExposure = {
            values: r.answers.dataExposure || [],
            description: r.answers.dataExposureDescription || "",
          };
        delete r.answers.dataExposure;
        delete r.answers.dataExposureDescription;
        if ((raw.schemaVersion || raw.version) < 9) {
          const retire = (rule, id = rule?.id) => {
            if (!rule || !retiredQualificationCondition(rule.conditions))
              return rule;
            (metadata.retiredRules ||= []).push({
              id,
              reason:
                "Previous qualification input has no safe equivalent in the v9 model. The library entry is retained for manual assessment.",
              conditions: rule.conditions,
            });
            if (raw.decisions && Object.hasOwn(raw.decisions, id))
              r.activeManualRisks = [
                ...new Set([
                  ...(r.activeManualRisks || raw.activeManualRisks || []),
                  id,
                ]),
              ];
            return { ...rule, conditions: null };
          };
          for (const key of ["customRisks", "customCatalog", "manualRisks"])
            if (Array.isArray(raw[key]))
              r[key] = raw[key].map((rule) => retire(rule));
          if (raw.riskOverrides && typeof raw.riskOverrides === "object")
            r.riskOverrides = Object.fromEntries(
              Object.entries(raw.riskOverrides).map(([id, rule]) => [
                id,
                retire(rule, id),
              ]),
            );
        }
        r.legacyMetadata = metadata;
        return r;
      }
      function dataVolumeRange(value) {
        const v = String(value ?? "").trim();
        if (!v) return "";
        const canonical = canonicalAnswer(v);
        if (DATA_VOLUMES.includes(canonical)) return canonical;
        const range = v.replace(/\s/g, "").replace(/-/g, "–");
        if (DATA_VOLUMES.includes(range)) return range;
        const match = v.match(
          /^((?:\d{1,3}(?:,\d{3})+)|(?:\d{1,3}(?: \d{3})+)|\d+)\s*(?:(?:employee|customer|payment|application)\s+)?(?:records?|entries|transactions?|users?|items?|identities)?$/i,
        );
        if (!match) return TBD;
        const count = Number(match[1].replace(/[, ]/g, ""));
        if (!Number.isSafeInteger(count) || count < 0) return TBD;
        return count <= 100
          ? "0–100"
          : count <= 500
            ? "100–500"
            : count <= 1000
              ? "500–1000"
              : ">1000";
      }
      function normalizeDataAssetV9(row, source = {}) {
        const previousNature =
          source.nature === undefined ? row.nature : source.nature;
        const original = Array.isArray(previousNature)
          ? previousNature
          : previousNature
            ? String(previousNature)
                .split(/[;,]/)
                .map((v) => v.trim())
            : [];
        const valid = [];
        for (const value of original) {
          const v = canonicalAnswer(value);
          if (v === "Personal Data") valid.push("PII");
          else if (DATA_NATURES.includes(v)) valid.push(v);
        }
        let nature = [...new Set(valid)];
        if (nature.some((v) => v !== TBD))
          nature = nature.filter((v) => v !== TBD);
        else if (original.length) nature = [TBD];
        const changes = {};
        if (
          JSON.stringify(nature) !== JSON.stringify(original) &&
          original.length
        )
          changes.nature = previousNature;
        row.nature = nature;
        const oldClass = source.classification ?? row.classification,
          classification =
            classificationLabel(row.classification) ||
            (["", TBD].includes(canonicalAnswer(row.classification))
              ? canonicalAnswer(row.classification)
              : TBD);
        if (oldClass && oldClass !== classification)
          changes.classification = oldClass;
        row.classification = classification;
        const oldVolume = source.volume ?? row.volume,
          volume = dataVolumeRange(oldVolume);
        if (oldVolume && oldVolume !== volume) changes.volume = oldVolume;
        row.volume = volume;
        for (const key of [
          "hostingLocation",
          "encryptedAtRest",
          "retention",
          "automaticDeletion",
          "backupPolicy",
          "name",
          "description",
        ]) {
          const old = source[key] ?? row[key];
          if (notApplicable(old)) {
            changes[key] = old;
            row[key] = TBD;
          } else if (uncertain(old)) row[key] = TBD;
        }
        if (Object.keys(changes).length) {
          row.legacyMetadata ||= {};
          row.legacyMetadata.v9 = {
            ...(row.legacyMetadata.v9 || {}),
            ...changes,
          };
        }
        return row;
      }
      function normalizeQualificationV9(raw, clean) {
        clean.legacyMetadata =
          raw.legacyMetadata && typeof raw.legacyMetadata === "object"
            ? JSON.parse(JSON.stringify(raw.legacyMetadata))
            : {};
        const source = Array.isArray(raw.dataTypes)
          ? raw.dataTypes.filter((r) => r && typeof r === "object")
          : [];
        clean.dataTypes.forEach((row, i) =>
          normalizeDataAssetV9(row, source[i] || row),
        );
        for (const key of ["dataExposure", "dataExposureDescription"])
          delete clean.answers[key];
        // An explicitly established historical regulated-data finding remains a manual assessment, never inferred from a new Nature category.
        if (
          (raw.schemaVersion || raw.version) < 9 &&
          source.some(
            (d) =>
              [].concat(d.nature || []).includes("Regulated") ||
              /\bRegulated\b/.test(d.classification || ""),
          ) &&
          !clean.activeManualRisks.includes("REG-003")
        )
          clean.activeManualRisks.push("REG-003");
      }
      function inventoryHeaders(key, advanced = false) {
        const basic =
          key === "flows"
            ? [
                ["source", "Source"],
                ["destination", "Destination"],
                ["protocol", "Service"],
                ["authentication", "Authentication"],
                ["encryption", "Encryption"],
                ["purpose", "Purpose"],
              ]
            : key === "profiles"
              ? [
                  ["name", "Population"],
                  ["type", "Type"],
                  ["volumeRange", "Volume"],
                  ["roleType", "Role"],
                  ["accessContexts", "Access Context"],
                  ["authentication", "Authentication"],
                ]
              : [
                  ["name", "Supplier"],
                  ["function", "Service"],
                  ["access", "Access"],
                  ["data", "Data"],
                  ["location", "Location"],
                  ["dependency", "Criticality"],
                ];
        const extra =
          key === "profiles"
            ? [
                ["origin", "Origin"],
                ["deviceType", "Device"],
                ["deviceManagement", "Management"],
                ["accessMethod", "Access Method"],
                ["mfa", "MFA"],
              ]
            : key === "flows"
              ? [
                  ["port", "Port"],
                  ["context", "Context"],
                  ["exposure", "Trust Boundary"],
                ]
              : [
                  ["serviceType", "Type"],
                  ["privileged", "Privileged"],
                  ["remote", "Remote"],
                  ["securityReview", "Security Review"],
                ];
        return advanced ? [...basic, ...extra] : basic;
      }
      function inlineRowStatus(key, row) {
        if (key === "profiles" && !profileCountFits(row))
          return "Count and range need review";
        const p = rowCompletion(key, row);
        return p.complete < p.total
          ? `${p.complete}/${p.total} required fields`
          : p.unknown
            ? TBD
            : "";
      }
      function inlineInventoryCell(key, row, field, label) {
        const f = INVENTORIES[key].fields.find((f) => f.key === field),
          value = f?.multi ? (row[field] || []).join(" + ") : row[field] || "",
          attr = `data-inventory="${key}" data-row-id="${esc(row.id)}" data-column="${field}" aria-label="${esc(label)} · ${esc(row.id)}"`;
        const closed =
          f?.options?.length &&
          (f.options === YN ||
            [
              "type",
              "volumeRange",
              "roleType",
              "origin",
              "deviceManagement",
              "dependency",
              "serviceType",
            ].includes(field));
        if (closed)
          return `<select ${attr}>${options([...new Set([...f.options, ...(value ? [value] : [])])], value, "Select...")}</select>`;
        const choices =
          field === "source" || field === "destination"
            ? [
                ...componentNames(state),
                ...state.thirdParties.map((r) => r.name),
                ...state.profiles.map((r) => r.name),
              ]
            : f?.options || [];
        return `<input ${attr} value="${esc(value)}" placeholder="${esc(label)}" ${choices.length ? `list="inline-${key}-${row.id}-${field}"` : ""} maxlength="3000" autocomplete="off">${choices.length ? `<datalist id="inline-${key}-${row.id}-${field}">${[...new Set(choices.map(canonicalAnswer))].map((v) => `<option value="${esc(v)}">`).join("")}</datalist>` : ""}${key === "profiles" && field === "authentication" && knownBoolean(row.mfa) === "yes" ? '<small class="inline-mfa" title="Multi-factor authentication enabled">MFA ✓</small>' : ""}`;
      }
      function controlGroup(id, title, sectionId, sources = []) {
        const section = sections.find((s) => s.id === sectionId),
          required = new Set(requiredQuestionKeys(state)[sectionId] || []),
          c = deriveProjectContext(state);
        const applicable =
          sectionId !== "administration" || c.hasPrivilegedUsers;
        const fields = applicable
          ? section.fields.filter(
              (f) =>
                !f.virtual &&
                !DERIVED_KEYS.has(f.key) &&
                f.key !== "accessIamComments" &&
                (!f.show || f.show(analysisState(state))),
            )
          : [];
        const core = fields.filter(
            (f) => required.has(f.key) || f.key === "secrets",
          ),
          secondary = fields.filter((f) => !core.includes(f));
        const body = `${
          sources.length
            ? `<div class="control-source-links">${sources
                .slice(0, isExpert() ? sources.length : 4)
                .map(
                  (source) =>
                    `<button class="small" data-follow-link="${esc(source.link)}">${esc(source.label)}</button>`,
                )
                .join("")}</div>`
            : ""
        }<div class="field-grid">${(isExpert() ? fields : core).map(renderField).join("")}</div>${!isExpert() && secondary.length ? `<details class="secondary-details"><summary>Additional applicable controls</summary><div class="field-grid">${secondary.map(renderField).join("")}</div></details>` : ""}${!fields.length && !sources.length ? '<p class="inline-note">No applicable access populations documented yet.</p>' : ""}`;
        const documentedCount = fields.filter((f) =>
          documented(state.answers[f.key]),
        ).length;
        const pendingCount = fields.filter((f) =>
          uncertain(state.answers[f.key]),
        ).length;
        const summary = `${documentedCount} documented${pendingCount ? ` · ${pendingCount} TBD` : ""}${sources.length ? ` · ${sources.length} related records` : ""}`;
        return `<details class="access-control-group" data-access-group="${id}" ${ui.accessGroups?.[id] ? "open" : ""}><summary>${title}<small>${summary}</small></summary><div class="access-control-body">${body}</div></details>`;
      }
      function accessSecurityControls() {
        const profiles = inventoryRows(state, "profiles"),
          flows = inventoryRows(state, "flows");
        const auth = profiles
          .filter((p) => !MACHINE_TYPES.includes(p.type))
          .map((p) => ({
            label: p.name || p.id,
            link: `inventory:profiles:${p.id}:authentication`,
          }));
        const privileged = profiles
          .filter((p) => p.roleType === "Privileged")
          .map((p) => ({
            label: p.name || p.id,
            link: `inventory:profiles:${p.id}:pam`,
          }));
        const technical = [
          ...profiles
            .filter((p) => MACHINE_TYPES.includes(p.type))
            .map((p) => ({
              label: p.name || p.id,
              link: `inventory:profiles:${p.id}:authentication`,
            })),
          ...flows
            .filter((f) =>
              /service account|api key|managed identity|workload/i.test(
                f.authentication,
              ),
            )
            .map((f) => ({
              label: f.id,
              link: `inventory:flows:${f.id}:authentication`,
            })),
        ];
        return `<section class="workspace-section" data-access-security><h3>Access Security Controls</h3>${controlGroup("auth", "Authentication & Authorization", "identity", auth)}${controlGroup("privileged", "Privileged Access", "administration", privileged)}${controlGroup("technical", "Technical Identities & Secrets", "secrets", technical)}</section>`;
      }
      function networkSecurityControls() {
        const fields = sections
          .find((s) => s.id === "network")
          .fields.filter(
            (f) =>
              !f.virtual &&
              !DERIVED_KEYS.has(f.key) &&
              (!f.show || f.show(analysisState(state))),
          );
        return `<section class="workspace-section" data-network-security><h3>Network Security Controls</h3><details class="access-control-group" data-access-group="network" ${ui.accessGroups?.network ? "open" : ""}><summary>Segmentation & Flow Restrictions<small>${fields.length} controls</small></summary><div class="access-control-body">${fields.length ? `<div class="field-grid">${fields.map(renderField).join("")}</div>` : '<p class="inline-note">Add a flow to qualify the remaining network controls.</p>'}</div></details></section>`;
      }
      document.addEventListener(
        "toggle",
        (event) => {
          const id = event.target.dataset?.accessGroup;
          if (id && event.target.isConnected) {
            ui.accessGroups ||= {};
            ui.accessGroups[id] = event.target.open;
          }
        },
        true,
      );
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-inventory-templates]");
        if (button) openInventoryTemplates(button.dataset.inventoryTemplates);
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (el.dataset.inventory && el.tagName === "INPUT") {
          const row = state[el.dataset.inventory].find(
              (r) => r.id === el.dataset.rowId,
            ),
            f = INVENTORIES[el.dataset.inventory].fields.find(
              (f) => f.key === el.dataset.column,
            );
          if (row && f)
            el.value = f.multi
              ? (row[f.key] || []).join(" + ")
              : row[f.key] || "";
        }
      });

      restoreLocal();
      clearFilters();
      populateIcons();
      render();
    </script>
  </body>
</html>
